<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:4px"><h1>Психостоматология вживую</h1><p class="sub" id="cnt"></p></div>
    <div class="tabs" role="tablist" aria-label="Вариант дизайна" id="tabs">
      <button role="tab" data-v="1">1 · Блокнот</button><button role="tab" data-v="2">2 · Жёлтый блокнот</button>
    </div>
  </header>
  <div class="ctrl">
    <label for="old"><input type="checkbox" id="old" checked> старые студенты</label>
    <label for="soft"><input type="checkbox" id="soft"> мягкая версия (без мата)</label>

    <div class="tw" id="tw"><button class="tzoom" id="tzoom" type="button" aria-pressed="false">⤢ крупнее</button><svg class="teeth" id="teeth" role="group" aria-label="Зубная формула, 32 зуба"></svg><svg class="teeth teethM" id="teethM" role="group" aria-label="Зубная формула, 32 зуба"></svg></div>
    <section class="pl" id="pl" hidden aria-live="polite"><div class="plh"><button class="back" type="button">← все участники</button><p class="hello"></p></div><h3></h3><p class="empty">Сцен пока нет. Они появятся после созвонов.</p><ol></ol><button class="more" type="button" hidden></button></section>
    <div class="arena" id="arena"><div class="card" id="card" hidden></div></div>
  </div>
  <p class="note" id="vdesc"></p>
</div>
<script>
{
const $=s=>document.querySelector(s), rnd=a=>a[Math.floor(Math.random()*a.length)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const QN={1:'верхний правый',2:'верхний левый',3:'нижний левый',4:'нижний правый'};
const TN={1:'центральный резец',2:'боковой резец',3:'клык',4:'первый премоляр',5:'второй премоляр',6:'первый моляр',7:'второй моляр',8:'зуб мудрости'};
const tname=f=>`${QN[f[0]]} ${TN[f[1]]}`, cap=s=>s[0].toUpperCase()+s.slice(1);
const VD={1:'Как на листочке: тетрадь в линейку, карандаш, зубы и человечки чуть дрожат.',2:'Жёлтый блокнот: жёлтая линованная бумага с красным полем, как у американских студентов.'};
/* по умолчанию разгрузочная версия: мат как есть. «Мягкая версия» — на всякий случай, для скриншотов */
const SOFT=[[/охренел[а-яё]*/gi,'обалдели'],[/охренеть/gi,'ничего себе'],[/нахрен/gi,'к чёрту'],[/бля[а-яё]*/gi,'ох'],[/задолбал[а-яё]*/gi,'достали'],[/[а-яё]*ху[йеёия][а-яё]*/gi,'…'],[/[а-яё]*пизд[а-яё]*/gi,'…'],[/(?<![а-яё])(?:за|на|вы|от|отъ|по|у|до|раз|при)?[её]б[ауилнл][а-яё]*/gi,'…'],[/сук[аи]/gi,'…']];
const soft=t=>$('#soft').checked?SOFT.reduce((s,[r,v])=>s.replace(r,v),t):t;
/* демо на случай, если data/live.json не загрузился */
const DEMO={updated:null,demo:true,people:[
 {n:'Паулетта',g:'f',t:['21'],old:false,q:['Да вы охренели все!','Опять держу лицо, блин'],b:[['мама','Мама, хватит меня успокаивать. Я злюсь.']]},
 {n:'Хуанито',g:'m',t:['43','33'],old:false,q:['Это не зуб, это мой батя','Ща как скажу им всё!'],b:[['папа','Папа, мне не нравится, как ты со мной говоришь.']]},
 {n:'Хуетта',g:'f',t:['46'],old:false,q:['Задолбали со своим «всё хорошо»!'],b:[]},
 {n:'Педрито',g:'m',t:['11','21'],old:false,q:['Нахрен медаль за покладистость!'],b:[['альфа-жертва','Я не буду молчать, когда мне неприятно!']]},
 {n:'Кончита',g:'f',t:['33'],old:false,q:['Я не злюсь. Я ЗЛЮСЬ!'],b:[]},
 {n:'Панчо',g:'m',t:['47'],old:false,q:['Чё вы ржёте, у меня 47-й горит!'],b:[]},
 {n:'Мерседес',g:'f',t:['36'],old:true,q:[],b:[]},{n:'Альфонсо',g:'m',t:['44'],old:true,q:[],b:[]}],
 fights:[[[0,'Ты опять за всех решила!'],[2,'А ты опять молчишь!'],[0,'Я не молчу, я держу лицо!'],[2,'Вот и держи, блин!']]],
 solo:[[1,['Я сегодня впервые сказал отцу, что мне неприятно.','Руки тряслись, но я это сделал!']]],
 bot:['Разбор: злость пришла, лицо держишь, зуб платит.','Напоминаю: листочек сам себя не напишет.']};

/* зубы */
const WD={1:92,2:80,3:88,4:90,5:90,6:106,7:104,8:98};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const H=88;
const shape=(p,w)=>{
  if(p<=2)return `M4 0V${H-10}Q4 ${H} 14 ${H}H${w-14}Q${w-4} ${H} ${w-4} ${H-10}V0Z`;
  if(p==3)return `M6 0V${H-28}L${w/2} ${H}L${w-6} ${H-28}V0Z`;
  if(p<=5)return `M6 0V${H-16}Q${w*.28} ${H} ${w/2} ${H-12}Q${w*.72} ${H} ${w-6} ${H-16}V0Z`;
  return `M3 0V${H-14}Q${w*.18} ${H} ${w*.34} ${H-12}Q${w*.5} ${H-22} ${w*.66} ${H-12}Q${w*.82} ${H} ${w-3} ${H-14}V0Z`};
let x=8;const xs=[];UP.forEach((f,i)=>{if(i==8)x+=18;xs.push(x);x+=WD[f%10]+6});
const TW=x+4,mid=xs[8]-12;
const T=$('#teeth');T.setAttribute('viewBox',`0 0 ${TW} 266`);
/* зуб в точке X; y0 — линия десны: у верхних коронка вниз, у нижних вверх */
const toothAt=(f,X,y0,low)=>{const w=WD[f%10],s=String(f),cy=low?y0-58:y0+58;
  return `<g class="tooth" data-f="${s}" role="button" tabindex="0" aria-label="Зуб ${s}, ${tname(s)}"><path transform="translate(${X},${y0})${low?' scale(1,-1)':''}" d="${shape(f%10,w)}"/><text class="num" x="${X+w/2}" y="${low?y0+26:y0-8}">${s}</text><g class="cnt" data-f="${s}" data-x="${X+w/2}" data-y="${cy}"></g></g>`};
T.innerHTML=`<line class="gum" x1="4" x2="${TW-4}" y1="30" y2="30"/><line class="gum" x1="4" x2="${TW-4}" y1="234" y2="234"/><line class="midl" x1="${mid}" x2="${mid}" y1="2" y2="264"/>`+UP.map((f,i)=>toothAt(f,xs[i],30,0)).join('')+LO.map((f,i)=>toothAt(f,xs[i],234,1)).join('');
/* телефон: вся формула помещается в ширину — 4 ряда по 8 (верх справа, верх слева, низ справа, низ слева) */
const TM=$('#teethM'),rowXs=r=>{let x=8;return r.map(f=>{const X=x;x+=WD[f%10]+6;return X})},MW=rowXs(UP.slice(0,8)).pop()+WD[1]+12;
const ROWS=[[UP.slice(0,8),30,0],[UP.slice(8),160,0],[LO.slice(0,8),390,1],[LO.slice(8),520,1]];
TM.setAttribute('viewBox',`0 0 ${MW} 556`);
TM.innerHTML=ROWS.map(([r,y0,low])=>{const X=rowXs(r);return `<line class="gum" x1="4" x2="${MW-4}" y1="${y0}" y2="${y0}"/>`+r.map((f,i)=>toothAt(f,X[i],y0,low)).join('')}).join('')+
  `<line class="midl" x1="4" x2="${MW-4}" y1="272" y2="272"/>`;

/* люди */
const A=$('#arena');let AW=A.clientWidth,AH=A.clientHeight;
const ro=new ResizeObserver(()=>{AW=A.clientWidth;AH=A.clientHeight});ro.observe(A);
const COL={f:'#e46aa2',m:'#4a86e8',u:'#8a7fd0',bot:'#9aa3b5',sad:'#7d8597'};
const MATRE=/ху[йеёяи]|пизд|бля|[её]б[ауил]|сук[аи]|жоп|нахер|хрен/i;
const mk=(d,kind)=>{const bot=kind===true,sad=kind=='sad';
  const old=!!d.old;
  const p={name:d.n,g:d.g,teeth:d.t||[],q:d.q||[],pb:d.b||[],c:bot?COL.bot:sad?COL.sad:COL[d.g]||COL.u,old,bot,
    x:.04+Math.random()*.92,y:old?Math.random()*.06:.25+Math.random()*.72,sp:.00005+Math.random()*.00005,walk:0,next:0,lock:old,hi:false};
  if(bot){p.x=1.12;p.y=.65;p.lock=true;p.sp=.00008}
  if(sad)p.lock=true;
  p.tx=p.x;p.ty=p.y;
  const el=document.createElement('div');el.className='p'+(old?' old':'')+(sad?' sad':'');el.style.setProperty('--c',p.c);
  if(old){el.setAttribute('aria-hidden','true');el.style.setProperty('--op',(.1+Math.random()*.3).toFixed(2))} // старые: просто рисунок на заднем плане
  else{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',p.name+(p.teeth.length?', зуб '+p.teeth.join(', '):''))}
  if(bot){el.className+=' botem';el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><text x="20" y="58" text-anchor="middle" style="font-size:46px">🤖</text></svg><span class="nm"></span>`}
  else el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><ellipse class="sh" cx="20" cy="79" rx="15" ry="3"/><circle class="hd" cx="20" cy="14" r="12"/><rect class="hs" x="8" y="2" width="24" height="24"/>${bot?'<text class="em" x="20" y="15">🤖</text>':''}<g class="face"></g><path class="bd" d="M20 26V77M9 50H31M7 77H33"/></svg><span class="nm"></span>`;
  el.querySelector('.nm').textContent=p.name;
  if(!old){el.addEventListener('click',()=>tap(p));el.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();tap(p)}})}
  p.el=el;p.b=el.querySelector('.b');A.append(el);if(!bot)setFace(p,'база');return p};

let P=[],act=[],old=[],bot=null,DATA=DEMO,sel=null;
/* зона сценки (доли ширины и высоты): пока идёт сценка, туда никто не заходит */
let zone=null;
/* места, куда гуляющим нельзя: баблы диалога и участники разговора (прямоугольники в пикселях площадки) */
let AVOID=[];
const figBox=(x,y)=>{const sc=(.5+.55*y)*(AW<520?.8:1),fy=104+y*(AH-118);return {l:x*AW-22,r:x*AW+22,t:fy-84*sc-6,b:fy+4}};
const hits=(a,b)=>a.l<b.r&&b.l<a.r&&a.t<b.b&&b.t<a.b;
const inAvoid=(x,y)=>{if(!AVOID.length)return false;const f=figBox(x,y);return AVOID.some(r=>hits(f,r))};
const candidate=p=>{
  let x=.04+Math.random()*.92,y=sel?(p.hi?.72+Math.random()*.26:.22+Math.random()*.3):.25+Math.random()*.72;
  if(zone){ // остаёмся со своей стороны зоны, чтобы не идти сквозь неё
    const roomL=zone.l-.04,roomR=.96-zone.r,leftSide=p.x<(zone.l+zone.r)/2;
    if(leftSide&&roomL>.06||!leftSide&&roomR<=.06&&roomL>.06)x=.04+Math.random()*roomL;
    else if(roomR>.06)x=zone.r+Math.random()*roomR;
    else y=zone.b+Math.random()*Math.max(.02,.98-zone.b); // по бокам места нет: встаём спереди
  }
  return {x,y}};
/* человечки выбирают место подальше от других, чтобы не толпиться */
const target=p=>{if(p.lock)return;let best=null,bd=-1;
  for(let k=0;k<(AVOID.length?20:7);k++){const c=candidate(p);if(inAvoid(c.x,c.y)||AVOID.length&&[.2,.4,.6,.8].some(f=>inAvoid(p.x+(c.x-p.x)*f,p.y+(c.y-p.y)*f)))continue;let d=1e9; // ни точка, ни путь к ней — не за баблом
    if(chase&&p!==chase.p&&!p.old)d=Math.hypot((chase.p.x-c.x)*AW,(chase.p.y-c.y)*AH); // убегаем от того, кто выебнулся
    else for(const o of P){if(o===p||o.old||o.bot||o.sad)continue;d=Math.min(d,Math.hypot((o.tx-c.x)*AW,(o.ty-c.y)*AH*.7),Math.hypot((o.x-c.x)*AW,(o.y-c.y)*AH*.7))}
    if(d>bd){bd=d;best=c}}
  if(!best)best=candidate(p);
  p.tx=best.x;p.ty=best.y};
const place=p=>{const s=(.5+.55*p.y)*(p.old?.7:1)*(AW<520?.8:1);
  const fy=104+p.y*(AH-118),bob=p.moving&&!RM?Math.abs(Math.sin(p.walk/110))*3:0;
  p.el.style.transform=`translate(${(p.x*AW-20).toFixed(1)}px,${(fy-84-bob).toFixed(1)}px)`;
  p.el.style.setProperty('--s',s.toFixed(3));p.el.style.zIndex=p.el.classList.contains('talk')?300:Math.round(p.y*100);
  p.el.classList.toggle('r',p.side?p.side=='l':p.x*AW>Math.max(AW*.5,AW-230))}; // side: бабл раскрывается от триггера
let last=performance.now();
const tick=t=>{const dt=Math.min(50,t-last);last=t;
  for(const p of P){
    if(p.orb&&t>=p.orb.t0){const o=p.orb,th=o.ph+(t-o.t0)*o.w; // плавное кружение по эллипсу, считается в каждом кадре
      p.x=p.tx=o.cx+o.R*Math.cos(th);p.y=p.ty=o.cy+o.r*Math.sin(th);p.moving=false;place(p);continue}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(RM){p.x=p.tx;p.y=p.ty;p.moving=false}
    else if(d>.004){const v=Math.min(p.sp*dt*(!p.lock&&(zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b||inAvoid(p.x,p.y))?3.5:1)*(chase&&!p.old?(p===chase.p?2.4:1.9):1),d);p.x+=dx/d*v;p.y+=dy/d*v*.6;p.walk+=dt;p.moving=true}
    else{p.moving=false;if(!p.lock){if(!p.next)p.next=t+800+Math.random()*3800;else if(t>p.next){p.next=0;target(p)}}}
    place(p)}
  requestAnimationFrame(tick)};

const say=(p,txt,ms,kind)=>{p.b.textContent=soft(txt);p.el.classList.add('talk');['fight','pb','pa','paa','react','brag','emo'].forEach(k=>p.el.classList.toggle(k,kind==k));
  clearTimeout(p.st);p.st=setTimeout(()=>p.el.classList.remove('talk','fight','pb','pa','paa','react','brag','emo'),ms)};
/* сколько держать бабл: никуда не торопимся.
   Одиночная фраза (монолог, точка Б, бот) висит ~10 секунд, реплика в диалоге ~5 секунд; длинные чуть дольше. */
const readMs=(t,mode)=>{const n=String(t).length;
  return mode=='dialog'?Math.min(7500,Math.max(5000,3000+n*40)):Math.min(13000,Math.max(10000,7000+n*50))};

/* Режиссёр. Случайной болтовни нет: на площадке идёт одна сценка за раз, потом тишина.
   Сценки: перепалка из чата, монолог, точка Б с грустнолицым, визит бота.
   Вокруг сценки пусто: остальные гуляют по краям и в зону не заходят. */
let scene=false;
const zoneHit=p=>zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b;
const clear=(cast,cx,cy)=>{
  const hw=Math.max(.2,125/Math.max(AW,1));
  zone={l:cx-hw,r:cx+hw,t:0,b:Math.min(.95,cy+.16)};
  const others=act.filter(p=>!cast.includes(p)&&!p.lock);
  others.forEach(p=>{p.next=0;target(p)}); // кто стоял в зоне, быстро уходит на свою сторону
  return others};
const release=ps=>{zone=null;ps.forEach(p=>{if(p.sad)return;p.lock=false;p.next=0})};
/* реплики, одна за другой, каждая столько, сколько её читать; возвращает общее время */
const play=(lines,start,mode)=>{let t=start;
  lines.forEach(([p,txt,kind])=>{const ms=readMs(txt,mode);setTimeout(()=>say(p,txt,ms,kind),t);t+=ms+(mode=='dialog'?400:900)});
  return t};
/* толпа изредка отзывается: не больше двух реплик за сценку, и только в паузе между репликами */
const cheerAt=(crowd,times)=>{const R=DATA.react||[];if(!R.length)return;
  times.forEach(t=>setTimeout(()=>{const w=crowd.filter(p=>!p.lock&&!p.el.classList.contains('talk')&&!zoneHit(p)&&(!sel||p.hi));if(w.length)say(rnd(w),rnd(R),3000,'react')},t))};
const spot=()=>({cx:.3+Math.random()*.4,cy:.42+Math.random()*.12});

const fightScene=done=>{const f=rnd(DATA.fights);
  const cnt={};f.forEach(([w])=>cnt[w]=(cnt[w]||0)+1);
  const cast=Object.keys(cnt).map(Number).sort((x,y)=>cnt[y]-cnt[x]).map(i=>P[i]);
  if(cast.some(p=>!p||p.old||p.lock)||(sel&&!cast.every(p=>p.hi)))return done(300);
  const {cx,cy}=spot(),gap=Math.max(.07,34/Math.max(AW,1));
  cast.forEach((p,i)=>{p.lock=true;p.tx=i==0?cx-gap:i==1?cx+gap:cx+(i%2?2.2:-2.2)*gap;p.ty=i<2?cy:cy+.08});
  const crowd=clear(cast,cx,cy);
  const end=play(f.map(([who,l])=>[P[who],l,'fight']),3200,'dialog');
  if(f.length>=4&&Math.random()<.6)cheerAt(crowd,[3200+(end-3200)*.55]); // отклик толпы ~3 с
  setTimeout(()=>{release(cast);done(3000)},end+700)};

/* монолог: человек выходит в центр и говорит несколько своих сообщений, написанных подряд;
   если таких нет — одну фразу, понятную без контекста */
const soloScene=done=>{
  const runs=(DATA.solo||[]).filter(([i])=>P[i]&&!P[i].old&&!P[i].lock&&(!sel||P[i].hi));
  let p,q;
  if(runs.length){const r=rnd(runs);p=P[r[0]];q=r[1]}
  else{const c=act.filter(x=>x.q.length&&!x.lock&&(!sel||x.hi));if(!c.length)return done(300);p=rnd(c);q=[rnd(p.q)]}
  const {cx,cy}=spot();
  p.lock=true;p.tx=cx;p.ty=cy;
  clear([p],cx,cy);
  const end=play(q.map(t=>[p,t]),3000);
  setTimeout(()=>{release([p]);done(3000)},end+500)};

/* Лица по рисунку владельца: код из таблицы «Лица» → черты на кружке головы (центр 20,14, радиус 12) */
const FACE={
  'база':'<path d="M16 9.5V13M24 9.5V13"/><path d="M14.5 17Q20 21.5 25.5 17"/>', // обычный смайлик: глаза-чёрточки и улыбка — у всех, кто гуляет
  'улыбка':'<circle cx="16" cy="11" r="1.6"/><circle cx="24" cy="11" r="1.6"/><path d="M14 17Q20 23 26 17"/>',
  'грустный':'<path d="M13 8L18 6.5M27 8L22 6.5"/><circle cx="16" cy="11.5" r="1.6"/><circle cx="24" cy="11.5" r="1.6"/><path d="M14 21Q20 15.5 26 21"/>',
  'очень грустный':'<path d="M13 7.5L18 5.5M27 7.5L22 5.5"/><circle cx="16" cy="11.5" r="1.7"/><circle cx="24" cy="11.5" r="1.7"/><path class="tear" d="M15 14Q14 17 15.5 17.5Q17 17 16 14Z"/><path d="M13 22Q20 14 27 22"/>',
  'злой':'<path d="M12 7L18 10M28 7L22 10"/><circle cx="16" cy="12" r="1.6"/><circle cx="24" cy="12" r="1.6"/><path d="M14 21Q20 16.5 26 21"/>',
  'очень злой':'<path d="M11 6L18 10.5M29 6L22 10.5" style="stroke-width:2.8"/><circle cx="16" cy="12.5" r="1.8"/><circle cx="24" cy="12.5" r="1.8"/><path d="M14 20.5H26" style="stroke-width:2.4"/>',
  'ржущий злой':'<path d="M12 6.5L18 9.5M28 6.5L22 9.5"/><circle cx="16" cy="11.5" r="1.5"/><circle cx="24" cy="11.5" r="1.5"/><path class="open" d="M12.5 16Q20 26 27.5 16Z"/>',

/* Обычные реплики (data/talk.json): фразы, которые владелец выбрал по скринам чата.
   Человечек говорит фразу, через секунду другой отвечает реакцией (💯, 😂…), обе висят. */
let TALK=[];

const byNick=n=>act.find(p=>p.name===n);
/* Реплика или целый диалог из переписки: {who,say,react} или {order:[…], lines:[{who,say,to,react},…]}.
   Раскладка по рисунку владельца: участники стоят просторно (трое — треугольником: order[0] слева вверху,
   order[1] снизу, order[2] справа вверху) и подходят, когда им пора говорить. Бабл висит между тем, кто

   коридоре, новый бабл — под предыдущим. Реакции — эмодзи у головы реагирующего (и гуляющих вокруг). */
const talkLines=T0=>(T0.lines||[T0]).map(l=>({p:byNick(l.who),say:l.say,to:l.to,R:(l.react||[]).map(r=>({p:byNick(r.who),e:r.emoji})).filter(r=>r.p)}));
const SPOTS={1:[[.5,.7]],2:[[.28,.66],[.72,.66]],3:[[.2,.5],[.5,.93],[.8,.5]],4:[[.2,.5],[.35,.93],[.65,.93],[.8,.5]]};
const talkScene=(T0,done)=>{const L=talkLines(T0);
  if(!L.length||L.some(l=>!l.p||!l.say))return done(300);
  const who=new Set();L.forEach(l=>who.add(l.p)); // в кругу — только те, кто говорит; реагируют и гуляющие вокруг
  let cast=(T0.order||[]).map(byNick).filter(o=>o&&who.has(o));
  [...who].forEach(o=>{if(!cast.includes(o))cast.push(o)});cast=cast.slice(0,4);
  if(cast.some(o=>o.lock))return done(300);
  const n=cast.length,timers=[],home=new Map(),sp0=new Map(),inScene=new Set();
  cast.forEach((o,k)=>{home.set(o,SPOTS[n][k]);sp0.set(o,o.sp)}); // участники гуляют, пока их не позовут говорить
  zone=null; // остальные просто бледнеют и гуляют на заднем плане
  A.classList.add('scene-on');
  const els=[],live=[],at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  // хвост-клин от бабла к голове говорящего: видно, кто говорит, даже если бабл сдвинут
  const WD=document.createElementNS('http://www.w3.org/2000/svg','svg');WD.setAttribute('class','wedges');A.append(WD);
  // бабл и хвост — один контур: скруглённый прямоугольник, в стороне к говорящему — клин до его головы
  // основание хвоста: сторона, из которой он выходит круче всего наружу (а не вдоль края тонкой щелью);
  // ширина основания — по размеру стороны, чтобы клин не залезал на скругления углов
  const tailBase=(x,y,w,h,hx,hy)=>{const R=Math.max(6,Math.min(16,h/2-6,w/2-6)),hwH=Math.min(11,w/2-R),hwV=Math.min(11,h/2-R);
    const cl=(v,lo,hi)=>lo>hi?(lo+hi)/2:Math.max(lo,Math.min(hi,v));
    const S=[['t',cl(hx,x+R+hwH,x+w-R-hwH),y,0,-1,hwH],['b',cl(hx,x+R+hwH,x+w-R-hwH),y+h,0,1,hwH],
      ['l',x,cl(hy,y+R+hwV,y+h-R-hwV),-1,0,hwV],['r',x+w,cl(hy,y+R+hwV,y+h-R-hwV),1,0,hwV]];
    let b=null,bs=-9;S.forEach(s=>{const vx=hx-s[1],vy=hy-s[2],sc=(vx*s[3]+vy*s[4])/(Math.hypot(vx,vy)||1);if(sc>bs){bs=sc;b=s}});
    return [b[0],b[1],b[2],b[5],R]};
  const wedge=(b,x,y,w,h)=>{const o=b._sp;if(!o)return;const r=o.el.querySelector('svg').getBoundingClientRect(),ar=A.getBoundingClientRect();
    const hx=r.left-ar.left+r.width/2,hy=r.top-ar.top+r.height*.15;
    const [side,cx,cy,hw,R]=tailBase(x,y,w,h,hx,hy),bx=cx,by=cy;
    const d=Math.hypot(hx-cx,hy-cy)||1,tip=Math.max(10,d-r.height*.2-6),tx=cx+(hx-cx)/d*tip,ty=cy+(hy-cy)/d*tip;
    const T=`L${tx.toFixed(1)},${ty.toFixed(1)}`;
    const path=`M${x+R},${y}`+(side=='t'?`L${bx-hw},${y}${T}L${bx+hw},${y}`:'')+`L${x+w-R},${y}Q${x+w},${y} ${x+w},${y+R}`
      +(side=='r'?`L${x+w},${by-hw}${T}L${x+w},${by+hw}`:'')+`L${x+w},${y+h-R}Q${x+w},${y+h} ${x+w-R},${y+h}`
      +(side=='b'?`L${bx+hw},${y+h}${T}L${bx-hw},${y+h}`:'')+`L${x+R},${y+h}Q${x},${y+h} ${x},${y+h-R}`
      +(side=='l'?`L${x},${by+hw}${T}L${x},${by-hw}`:'')+`L${x},${y+R}Q${x},${y} ${x+R},${y}Z`;
    if(!b._w){b._w=document.createElementNS('http://www.w3.org/2000/svg','path');WD.append(b._w)}
    b._w.setAttribute('d',path);b._w.classList.toggle('on',b.classList.contains('on'))};
  const rewedge=setInterval(()=>els.forEach(b=>{if(b._box)wedge(b,b._box.x,b._box.y,b._box.w,b._box.h)}),120); // хвост следит за головой, пока та доходит

  const enter=o=>{if(!inScene.has(o)){inScene.add(o);o.lock=true;o.sp=.00024;o.el.classList.add('cast','named')}[o.tx,o.ty]=home.get(o)};
  const headPx=o=>{const [x,y]=home.get(o);return [x*AW,104+y*(AH-118)-84*(.5+.55*y)*(AW<520?.8:1)]};
  // Раскладка: каждый новый бабл ищет место рядом со своим говорящим, хвостом в сторону собеседника;
  // ответ по возможности — прямо под сообщением, на которое отвечает. Место отбрасывается, если бабл
  // или его хвост задевает чужой бабл, чужой хвост, лицо или подпись имени. Висящие баблы не двигаются.
  const shown=()=>els.filter(b=>b._box);
  const segHit=(x1,y1,x2,y2,r)=>{for(let k=1;k<20;k++){const x=x1+(x2-x1)*k/20,y=y1+(y2-y1)*k/20;if(x>r.l&&x<r.r&&y>r.t&&y<r.b)return true}return false};
  const bodyOf=o=>{const [x,y]=home.get(o),f=figBox(x,y);return {l:f.l-26,r:f.r+26,t:f.t-8,b:f.b+24}};
  const headOf=o=>{const [x,y]=home.get(o),f=figBox(x,y),sc=(.5+.55*y)*(AW<520?.8:1);return [(f.l+f.r)/2,f.t+6+12*sc]};
  const reactBoxes=()=>{const ar=A.getBoundingClientRect(),out=[];act.forEach(o=>{if(o.el.classList.contains('rxon')&&o.el.classList.contains('talk')){const r=o.b.getBoundingClientRect();out.push({l:r.left-ar.left-6,r:r.right-ar.left+6,t:r.top-ar.top-6,b:r.bottom-ar.top+6})}});return out};
  const updAvoid=()=>{const bx=shown().map(b=>({l:b._box.x-10,r:b._box.x+b._box.w+10,t:b._box.y-10,b:b._box.y+b._box.h+10}));

    act.forEach(o=>{if(!o.lock&&inAvoid(o.tx,o.ty)){o.next=0;target(o)}})}; // кто шёл за бабл — разворачивается
  const placeBubble=(b,sp,to,qb)=>{const w=b.offsetWidth,h=b.offsetHeight,[hx,hy]=headOf(sp);

    return best};
  const putBubble=(b,sp,to,qb)=>{let best=placeBubble(b,sp,to,qb);
    for(let k=0;k<4&&!best;k++){const old=shown().filter(x=>x!==b&&x!==qb)[0];if(!old)break;drop(old);best=placeBubble(b,sp,to,qb)} // места нет — уходит самое старое
    if(!best){const [hx,hy]=headOf(sp);best={x:Math.max(4,Math.min(AW-b.offsetWidth-4,hx-b.offsetWidth/2)),y:Math.max(4,hy-b.offsetHeight-70),t:null}}
    const w=b.offsetWidth,h=b.offsetHeight;b._box={x:best.x,y:best.y,w,h};b._tail=best.t;
    b.style.left=best.x+'px';b.style.top=best.y+'px';wedge(b,best.x,best.y,w,h);updAvoid()};
  const drop=b=>{b._box=null;b._tail=null;b.classList.remove('on');if(b._w)b._w.classList.remove('on');setTimeout(()=>{b.remove();if(b._w)b._w.remove()},400);updAvoid()};
  const keep=L.map((l,i)=>Math.max(i+2,...L.map((x,k)=>x.to===i?k+1:-1)));
  // концовка «ванна»: говорившие уходят за край, потом коллаж — каждая в своей ванне, шушукаются
  const outro=()=>{at(1800,()=>{els.forEach(b=>{if(b._box)drop(b)});cast.forEach((o,k)=>{o.sp=.0004;o.tx=1.14;o.ty=.55+k*.08})});
    at(4200,()=>{const C=document.createElement('div');C.className='tubs';els.push(C);
      const dark=new Set(T0.dark||[]),fr=cast.slice(0,2).map(o=>{const f=document.createElement('div');f.className='tubf'+(dark.has(o.name)?' dark':'');
        const g=document.createElement('div');g.className='fig';g.style.setProperty('--c',getComputedStyle(o.el).getPropertyValue('--c'));
        const sv=o.el.querySelector('svg').cloneNode(true);sv.removeAttribute('style');g.append(sv);
        f.innerHTML='<svg class="tub" viewBox="0 0 200 150" aria-hidden="true"><path class="tp" d="M168 80V44q0-10-10-10h-12"/><path class="tl" d="M54 126l-7 14M146 126l7 14"/><path class="tb2" d="M22 80H178Q178 126 130 126H70Q22 126 22 80Z"/><g class="fm"><circle cx="40" cy="80" r="9"/><circle cx="56" cy="76" r="8"/><circle cx="104" cy="77" r="9"/><circle cx="122" cy="80" r="8"/><circle cx="140" cy="76" r="9"/><circle cx="158" cy="80" r="7"/></g></svg><span class="shu"></span><span class="nm2"></span>';
        f.prepend(g);f.querySelector('.nm2').textContent=o.name;C.append(f);return f});
      A.append(C);requestAnimationFrame(()=>C.classList.add('on'));
      const W=['шу-шу','пс-пс','хи-хи','шу-шу-шу','пс…'];
      for(let k=0;k<7;k++)at(700+k*1000,()=>{fr.forEach((f,j)=>f.querySelector('.shu').classList.toggle('on',j==k%fr.length));const s=fr[k%fr.length].querySelector('.shu');s.textContent=W[k%W.length]});
      at(8000,()=>{C.classList.remove('on');setTimeout(()=>C.remove(),600)});
      at(8700,()=>{fin();done(3500)})})};
  const step=i=>{if(i>=L.length)return T0.end=='ванна'?outro():at(2200,()=>{fin();done(3500)});
    L.forEach((_,k)=>{if(keep[k]===i&&live[k]&&live[k]._box)drop(live[k])});
    const l=L[i],q=l.to!=null?L[l.to]:null,to=q&&q.p!==l.p?q.p:null;
    enter(l.p);if(to)enter(to);
    l.R.forEach(r=>{if(cast.includes(r.p))enter(r.p)}); // реагирующий из диалога — встаёт на своё место
    const ms=readMs(l.say,'dialog')+(l.R.length?1400:0);
    waitFor(()=>arrived(l.p),()=>{
      const b=document.createElement('div');b.className='tb';
      b.innerHTML='<span class="tx"></span>';b.querySelector('.tx').textContent=soft(l.say);
      b._sp=l.p;A.append(b);live[i]=b;els.push(b);
      const qb=q&&live[l.to]&&live[l.to]._box?live[l.to]:null;
      putBubble(b,l.p,to||(q?q.p:null),qb);requestAnimationFrame(()=>{b.classList.add('on');if(b._w)b._w.classList.add('on')});
      l.p.el.classList.add('speaking');setTimeout(()=>l.p.el.classList.remove('speaking'),1600);
      l.R.forEach((r,j)=>at(1100+j*800,()=>{const h=Math.max(2500,ms-1100-j*800);
        // эмодзи — с той стороны головы, где нет баблов (справа, слева или сверху)
        const ar=A.getBoundingClientRect(),hr=r.p.el.querySelector('svg').getBoundingClientRect(),hx=hr.left-ar.left+hr.width/2,hy=hr.top-ar.top+hr.height*.2;
        const busy=z=>shown().some(x=>hits(z,{l:x._box.x,r:x._box.x+x._box.w,t:x._box.y,b:x._box.y+x._box.h}));
        const R_={l:hx+8,r:hx+90,t:hy-28,b:hy+28},L_={l:hx-90,r:hx-8,t:hy-28,b:hy+28};
        r.p.el.classList.remove('eml','emt');if(busy(R_))r.p.el.classList.add(busy(L_)?'emt':'eml');
        // реагирующий со стороны замирает на месте, пока висит эмодзи — не ходит по баблам и людям
        const fz=!inScene.has(r.p)&&!r.p.lock;if(fz){r.p.lock=true;r.p.tx=r.p.x;r.p.ty=r.p.y}
        r.p.el.classList.add('cast','rxon');say(r.p,r.e,h,'emo');
        setTimeout(()=>{r.p.el.classList.remove('rxon');if(!inScene.has(r.p)){r.p.el.classList.remove('cast');if(fz){r.p.lock=false;r.p.next=0}}},h)}));
      at(ms,()=>step(i+1))},6000)};
  at(600,()=>step(0));
  const fin=()=>{clearInterval(rewedge);AVOID=[];els.forEach(b=>{b._box=null;b.classList.remove('on');setTimeout(()=>b.remove(),400)});WD.style.opacity=0;setTimeout(()=>WD.remove(),400);
    A.classList.remove('scene-on');act.forEach(o=>o.el.classList.remove('rxon'));L.forEach(l=>l.R.forEach(r=>{if(!inScene.has(r.p))r.p.el.classList.remove('cast')}));
    cast.forEach(o=>{o.el.classList.remove('cast','named','speaking');o.sp=sp0.get(o)});release(cast);curScene=null};
  curScene={p:cast[0],stop:()=>{timers.forEach(clearTimeout);fin();zone=null;scene=false}}};
const director=()=>{if(scene||focus)return kick(2000); // на странице человека сцены идут только из его плейлиста
  const list=(DATA.comm||[]).filter(c=>isStory(c)&&P[c[0]]&&!P[c[0]].old&&!P[c[0]].lock&&(!sel||P[c[0]].hi));
  const talk=TALK.filter(t=>{const L=talkLines(t);return L.length&&L.every(l=>l.p&&!l.p.lock)&&(!sel||L.some(l=>l.p.hi))});
  if(!list.length&&!talk.length)return kick(4000);
  scene=true;const fin=pause=>{scene=false;kick(pause+4000+Math.random()*4000)};
  // истории главные; реплики — в паузах между ними (если историй нет — только реплики)
  if(list.length&&(!talk.length||Math.random()<.5))storyScene(rnd(list),fin);else talkScene(rnd(talk),fin)};

/* выбор зуба */
const info=()=>{const I=$('#info');I.textContent='';
  if(!sel){I.innerHTML=`Нажмите на зуб, чтобы собрать тех, кто с ним работает.`;return}
  const a=act.filter(p=>p.hi);
  const b=document.createElement('b');b.textContent=`${sel} · ${cap(tname(sel))}`;I.append(b,document.createElement('br'),
    a.length?a.map(p=>p.name).join(', '):'Сейчас с этим зубом никто не работает')};
const pick=f=>{sel=sel===f?null:f;
  document.querySelectorAll('.tooth').forEach(g=>{g.classList.toggle('sel',g.dataset.f===sel);g.setAttribute('aria-pressed',g.dataset.f===sel)});
  P.forEach(p=>{p.hi=!!sel&&!p.old&&p.teeth.includes(sel);p.el.classList.toggle('hi',p.hi);p.el.classList.toggle('dim',!!sel&&!p.hi&&!p.bot);if(!p.lock){p.next=0;target(p)}});info()};
$('#tzoom').addEventListener('click',e=>{const on=$('#tw').classList.toggle('tbig');e.currentTarget.textContent=on?'⤡ мельче':'⤢ крупнее';if(on)$('#tw').scrollLeft=($('#tw').scrollWidth-$('#tw').clientWidth)/2;e.currentTarget.setAttribute('aria-pressed',on)});
/* на странице человека зуб выбирает сцены из его жизни; иначе собирает всех, кто с ним работает */
const toothTap=f=>{if(!focus)return pick(f);if(!teethOf(focus).includes(f))return;fT=fT===f?null:f;plOpen=false;markTeeth();plRender()};
[T,TM].forEach(svg=>{svg.addEventListener('click',e=>{const g=e.target.closest('.tooth');if(g)toothTap(g.dataset.f)});
  svg.addEventListener('keydown',e=>{const g=e.target.closest('.tooth');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();toothTap(g.dataset.f)}})});
$('#all').addEventListener('click',()=>{if(sel)pick(sel)});

/* окошко человека */
const C=$('#card'),tl=f=>`${f} (${tname(f)})`;
const greet=p=>{const T2=p.teeth,verb=p.old?(p.g=='f'?'работала':p.g=='m'?'работал':'работал(а)'):'работаю';
  return p.bot?`Привет, я ${p.name}. Приношу цитаты из разборов.`:`Привет, меня зовут ${p.name}. `+(T2.length?`Я ${verb} ${T2.length>1?`с зубами ${T2.slice(0,-1).map(tl).join(', ')} и ${tl(T2[T2.length-1])}`:`с зубом ${tl(T2[0])}`}.`:'Мой зуб пока не записан.')};
const card=p=>{if(p.sad)return;C.hidden=false;const txt=greet(p);
  C.innerHTML='<button class="x" type="button" aria-label="Закрыть">×</button><p style="padding-right:30px"></p>';
  C.querySelector('p').textContent=txt;C.querySelector('.x').addEventListener('click',()=>{C.hidden=true})};

const start=d=>{DATA=d;
  P=d.people.map(x=>mk(x,false));act=P.filter(p=>!p.old);old=P.filter(p=>p.old);
  bot=mk({n:'Бот Джузеппе',g:'u',t:[]},true);P.push(bot);
  document.querySelectorAll('.cnt').forEach(g=>{const n=act.filter(p=>p.teeth.includes(g.dataset.f)).length;if(!n)return;
    g.innerHTML=`<circle cx="${g.dataset.x}" cy="${g.dataset.y}" r="14"/><text x="${g.dataset.x}" y="${g.dataset.y}">${n}</text>`});
  const upd=d.updated?new Date(d.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}):null;
  $('#cnt').textContent=d.demo?'Демо: живые данные не загрузились':`Активных участников: ${act.length}`;
  info();requestAnimationFrame(tick);
  kick(1200);
};
fetch('data/live.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>d.people&&d.people.length?d:DEMO).catch(()=>DEMO).then(start);

/* варианты */
const setV=v=>{document.body.dataset.v=v;$('#vdesc').textContent=`Вариант ${v}. ${VD[v]}`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))};
const fromHash=()=>{const m=location.hash.match(/^#v([12])$/);setV(m?m[1]:'1')};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){location.hash='v'+b.dataset.v}});
addEventListener('hashchange',fromHash);fromHash();
$('#old').addEventListener('change',e=>document.body.classList.toggle('noold',!e.target.checked));
}
</script>
</body>
