<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Психостоматология вживую</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Neucha&family=Rubik:wght@500;700&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Manrope:wght@500;700&display=swap">
<style>
/* VOICE: игровой, живой, с матом из чата; первая страница по скетчу владельца
   IDEA: зубная формула над площадкой, где гуляют человечки-участники и говорят баблами
   PICTURE: 32 кликабельных зуба + площадка с фигурками «кружок, палка, две перекладины»
   COLOUR/TYPE: пять вариантов: блокнот, блокнот с татами, рентген, школьная доска, комикс
   LAYOUT: шапка с переключателем вариантов, строка зуба, сцена во всю ширину */
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;color-scheme:var(--cs)}
body[data-v="1"],body[data-v="2"]{--cs:light;--font:Neucha,"Comic Sans MS",cursive;--bg:#fbfaf5;--ink:#2a2a35;--mute:#5d5d6c;--stage:transparent;--arena:transparent;--tooth:#fff;--tink:#2a2a35;--tnum:#2a2a35;--fig:#2a2a35;--acc:#d2452f;--acct:#fff;--accs:#fde3dc;--bub:#fff;--bubi:#2a2a35;--bubl:#2a2a35;--tw:2.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#d3def0 31px 32px)}
/* 2: тот же блокнот, посередине площадки бойцовское татами — сценки идут на нём */
body[data-v="2"] .arena::before{content:"";position:absolute;left:50%;top:52%;width:min(78%,620px);height:62%;transform:translate(-50%,-50%) perspective(700px) rotateX(38deg);
  background:linear-gradient(#f2c230,#f2c230) center/46% 46% no-repeat,linear-gradient(#2f62c8,#2f62c8) center/86% 86% no-repeat,#d23b30;border:3px solid #2a2a35;border-radius:6px;opacity:.92;filter:url(#rough)}
/* 3: рентгеновский снимок — тёмная плёнка, зубы светятся */
body[data-v="3"]{--cs:dark;--font:Inter,system-ui,sans-serif;--bg:#071219;--ink:#d8f3ff;--mute:#8fb4c4;--stage:radial-gradient(ellipse at 50% 30%,#163646 0,#0a1c26 55%,#050d12 100%);--arena:transparent;--tooth:#e9f8ff;--tink:#9fdcf5;--tnum:#9fdcf5;--fig:#bfeaff;--acc:#ffd45c;--acct:#071219;--accs:#2c5a70;--bub:#0e2733;--bubi:#e9f8ff;--bubl:#7fd3f2;--tw:2;--nm:#d8f3ff}
/* 4: школьная доска — мел по зелёному */
body[data-v="4"]{--cs:dark;--font:Neucha,"Comic Sans MS",cursive;--bg:#25382d;--ink:#f3f1e6;--mute:#c9d6c8;--stage:#2f4a39;--arena:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.06),transparent 70%);--tooth:#2f4a39;--tink:#f3f1e6;--tnum:#f3f1e6;--fig:#f3f1e6;--acc:#ffd36e;--acct:#25382d;--accs:#46664f;--bub:#2f4a39;--bubi:#f3f1e6;--bubl:#f3f1e6;--tw:2.5;--sb:10px solid #7a5a3a;--nm:#f3f1e6}
/* 5: комикс — жёлтый растр, толстый контур, хлёсткие баблы */
body[data-v="5"]{--cs:light;--font:Rubik,system-ui,sans-serif;--bg:#ffe45c;--ink:#111;--mute:#3a3410;--stage:radial-gradient(#f4a300 1.2px,transparent 1.6px) 0 0/10px 10px,#ffd23f;--arena:radial-gradient(#ffffff 1.4px,transparent 1.8px) 0 0/12px 12px,#4fc3f7;--tooth:#fff;--tink:#111;--tnum:#111;--fig:#111;--acc:#e5262b;--acct:#fff;--accs:#ffb3b3;--bub:#fff;--bubi:#111;--bubl:#111;--tw:4;--sb:4px solid #111;--r:6px}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 36px;padding-left:max(16px,4vw);padding-right:max(16px,4vw);display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--hfont,var(--font));font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.08;margin:0;text-wrap:balance}
.sub,.note{margin:0;color:var(--mute);font-size:.9em}
.tabs,.ctrl{display:flex;flex-wrap:wrap;gap:6px}
.ctrl{gap:8px 18px;align-items:center}
button{font:inherit}
.tabs button,.ctrl button{min-height:42px;padding:0 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--r,999px);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,.tooth:focus-visible,.p:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ctrl label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.ctrl input{width:20px;height:20px;accent-color:var(--acc)}
.info{margin:0;min-height:3em;font-size:1.05em}
.info b{font-size:1.25em}
.stage{background:var(--stage);border-radius:var(--sr,18px);overflow:hidden;border:var(--sb,0)}
.tw{overflow-x:auto}
.teeth{display:block;width:100%;min-width:640px;height:auto;padding:6px 8px 0}
.teethM{display:none;min-width:0}
@media(max-width:600px){.teeth{display:none}.teethM{display:block}.teethM .num{font-size:30px}.teethM .cnt text{font-size:22px}}
.tooth{cursor:pointer}
.tooth path{fill:var(--tooth);stroke:var(--tink);stroke-width:var(--tw);stroke-linejoin:round}
.tooth:hover path,.tooth:focus-visible path{fill:var(--accs)}
.tooth.sel path{fill:var(--acc)}
.num{fill:var(--tnum);font:700 21px Inter,system-ui,sans-serif;text-anchor:middle}

.cnt circle{fill:var(--acc)}.cnt text{fill:var(--acct);font:700 17px Manrope,sans-serif;text-anchor:middle;dominant-baseline:central}
.gum{stroke:var(--tink);stroke-width:var(--tw)}.midl{stroke:var(--tink);stroke-dasharray:6 8;stroke-width:2}
body[data-v="1"] .tooth path,body[data-v="1"] .p svg,body[data-v="2"] .tooth path,body[data-v="2"] .p svg,body[data-v="4"] .tooth path,body[data-v="4"] .p svg{filter:url(#rough)}
body[data-v="3"] .tooth path{filter:drop-shadow(0 0 6px #7fd3f2)}
.arena{position:relative;height:clamp(420px,66vh,680px);overflow:hidden;background:var(--arena)}
.p{position:absolute;left:0;top:0;width:40px;height:84px;cursor:pointer;transition:opacity .4s}
.p svg{width:40px;height:84px;overflow:visible;transform:scale(var(--s,1));transform-origin:50% 100%;display:block}
.hd{fill:var(--c)}.hs{display:none;fill:var(--c)}
.bd{fill:none;stroke:var(--fig);stroke-width:3;stroke-linecap:round}
.sh{fill:rgba(0,0,0,.16);display:none}
.em{font-size:15px;text-anchor:middle;dominant-baseline:central}
body[data-v="1"] .hd,body[data-v="2"] .hd{fill:var(--bg);stroke:var(--c);stroke-width:3}body[data-v="1"] .bd,body[data-v="2"] .bd{stroke-width:2.5}
body[data-v="3"] .hd{fill:none;stroke:var(--c);stroke-width:3;filter:drop-shadow(0 0 4px var(--c))}body[data-v="3"] .bd{stroke-width:2.5;filter:drop-shadow(0 0 3px #7fd3f2)}
body[data-v="4"] .hd{fill:none;stroke:var(--c);stroke-width:3}body[data-v="4"] .bd{stroke-width:2.5}
body[data-v="5"] .hd{stroke:#111;stroke-width:3.5}body[data-v="5"] .bd{stroke-width:5}body[data-v="5"] .sh{display:inline}
.nm{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;display:none;color:var(--nm,var(--ink));font-weight:700}

.p:hover .nm,.p.hi .nm,.p:focus-visible .nm{display:block}
.p.hi svg{filter:drop-shadow(0 0 5px var(--acc)) drop-shadow(0 0 2px var(--acc))}
.p.old{opacity:var(--op,.3);filter:grayscale(1);pointer-events:none}
.p.dim{opacity:.13}
.noold .p.old{display:none}
.b{display:none;position:absolute;left:50%;bottom:calc(84px*var(--s,1) + 12px);transform:translateX(-24px);width:max-content;max-width:200px;padding:7px 11px;background:var(--bub);color:var(--bubi);border:2px solid var(--bubl);border-radius:16px;font-size:14px;line-height:1.25;z-index:2}
.b::after{content:"";position:absolute;left:14px;bottom:-8px;width:12px;height:12px;background:var(--bub);border-right:2px solid var(--bubl);border-bottom:2px solid var(--bubl);transform:rotate(45deg)}
.r .b{transform:translateX(calc(-100% + 24px))}.r .b::after{left:auto;right:14px}
.talk .b{display:block}
.p.sad .nm:empty{display:none!important}
.p.sad .nm{display:block;top:auto;bottom:calc(84px*var(--s,1) + 2px);font-size:12px;background:var(--bub);color:var(--bubi);border:1px solid var(--bubl);border-radius:8px;padding:0 6px}
.p.sad.talk .nm{display:none}
.face circle{fill:#1d1d1d}.face path{fill:none;stroke:#1d1d1d;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.face .tear{fill:#4a86e8}.face .glass{fill:#111;stroke:none}.face .open{fill:#fff}
.p.big svg{transform:scale(calc(var(--s,1)*1.35))}.p.big .b{bottom:calc(84px*var(--s,1)*1.35 + 12px)}
.p.sad.big .nm{bottom:calc(84px*var(--s,1)*1.35 + 4px)}
.p.pa .b{background:#eceef3;color:#2a2d38;border-color:#8a90a3;border-width:3px;font-weight:700}
.p.pa .b::after{background:#eceef3;border-color:#8a90a3}
.p.pa .b::before{content:"точка А";display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.p.paa .b{background:#e6e3f5;color:#2a2440;border-color:#7a6fb0;border-width:3px;font-weight:700}
.p.paa .b::after{background:#e6e3f5;border-color:#7a6fb0}
.p.paa .b::before{content:"точка АА";display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.tooth.flash path{animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{to{fill:#e8432f}}
.portal{position:absolute;left:50%;top:48%;width:min(56%,340px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:350;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,1.4,.4,1),opacity .6s}
.portal.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.portal svg{width:100%;height:100%;overflow:visible}
@media(prefers-reduced-motion:reduce){.portal{transition:opacity .3s}.tooth.flash path{animation:none;fill:#e8432f}}
body[data-v="3"] .face circle,body[data-v="4"] .face circle{fill:var(--fig)}body[data-v="3"] .face path,body[data-v="4"] .face path{stroke:var(--fig)}
.p.pa .b,.p.paa .b,.p.pb .b{max-width:240px}
.react .b{font-size:12px;padding:4px 8px;opacity:.92}
.brag .b{border-width:3px;font-weight:700}
.botem svg{overflow:visible}
.p.pb .b{background:#ffe9a6;color:#2a1d00;border-color:#d9a400;border-width:3px;font-weight:700}
.p.pb .b::after{background:#ffe9a6;border-color:#d9a400}
.p.pb .b::before{content:"точка Б";display:block;font-size:11px;font-weight:700;letter-spacing:.02em;opacity:.7;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9em;color:var(--mute);margin:0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:2px solid}
body[data-v="1"] .b,body[data-v="2"] .b,body[data-v="4"] .b{border-radius:22px 16px 20px 14px}
body[data-v="3"] .b{border-radius:6px;border-width:1px;box-shadow:0 0 12px rgba(127,211,242,.35)}
body[data-v="5"] .b{border-width:3px;border-radius:18px;font-weight:600;box-shadow:4px 4px 0 #111}
.card{position:absolute;top:12px;right:12px;z-index:400;width:min(270px,calc(100% - 24px));background:var(--bub);color:var(--bubi);border:2px solid var(--bubl);border-radius:var(--r,14px);padding:14px 16px;display:grid;gap:6px;font-size:14px}
.card p{margin:0}.card .ch{display:flex;gap:8px;align-items:center;font-size:18px}.card .ch i{width:14px;height:14px;border-radius:50%}
.card .x{position:absolute;top:4px;right:4px;width:40px;height:40px;border:0;background:transparent;color:inherit;font-size:22px;cursor:pointer}
.card .note{color:inherit;opacity:.7}
@media(prefers-reduced-motion:reduce){.p{transition:none}}
</style>
</head>
<body data-v="1">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:4px"><h1>Психостоматология вживую</h1><p class="sub" id="cnt"></p></div>
    <div class="tabs" role="tablist" aria-label="Вариант дизайна" id="tabs">
      <button role="tab" data-v="1">1 · Блокнот</button><button role="tab" data-v="2">2 · Блокнот и татами</button><button role="tab" data-v="3">3 · Рентген</button><button role="tab" data-v="4">4 · Школьная доска</button><button role="tab" data-v="5">5 · Комикс</button>
    </div>
  </header>
  <div class="ctrl">
    <label for="old"><input type="checkbox" id="old" checked> старые студенты</label>
    <label for="soft"><input type="checkbox" id="soft"> мягкая версия (без мата)</label>
    <button id="all" type="button">показать всех</button>
  </div>
  <p class="info" id="info" aria-live="polite"></p>
  <div class="stage">
    <div class="tw"><svg class="teeth" id="teeth" role="group" aria-label="Зубная формула, 32 зуба"></svg><svg class="teeth teethM" id="teethM" role="group" aria-label="Зубная формула, 32 зуба"></svg></div>
    <div class="arena" id="arena"><div class="card" id="card" hidden></div></div>
  </div>
  <p class="note" id="vdesc"></p>
</div>
<script>
{
const $=s=>document.querySelector(s), rnd=a=>a[Math.floor(Math.random()*a.length)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const QN={1:'верхний правый',2:'верхний левый',3:'нижний левый',4:'нижний правый'};
const TN={1:'центральный резец',2:'боковой резец',3:'клык',4:'первый премоляр',5:'второй премоляр',6:'первый моляр',7:'второй моляр',8:'зуб мудрости'};
const tname=f=>`${QN[f[0]]} ${TN[f[1]]}`, cap=s=>s[0].toUpperCase()+s.slice(1);
const VD={1:'Как на листочке: тетрадь в линейку, карандаш, зубы и человечки чуть дрожат.',2:'Тот же блокнот, а посередине площадки бойцовское татами: сценки идут на нём.',3:'Рентгеновский снимок: зубы светятся на тёмной плёнке, человечки — светящиеся контуры.',4:'Школьная доска: всё нарисовано мелом, как на уроке в классе.',5:'Комикс: жёлтый растр, толстый контур, хлёсткие баблы.'};
/* по умолчанию разгрузочная версия: мат как есть. «Мягкая версия» — на всякий случай, для скриншотов */
const SOFT=[[/охренел[а-яё]*/gi,'обалдели'],[/охренеть/gi,'ничего себе'],[/нахрен/gi,'к чёрту'],[/бля[а-яё]*/gi,'ох'],[/задолбал[а-яё]*/gi,'достали'],[/[а-яё]*ху[йеёия][а-яё]*/gi,'…'],[/[а-яё]*пизд[а-яё]*/gi,'…'],[/(?<![а-яё])(?:за|на|вы|от|отъ|по|у|до|раз|при)?[её]б[ауилнл][а-яё]*/gi,'…'],[/сук[аи]/gi,'…']];
const soft=t=>$('#soft').checked?SOFT.reduce((s,[r,v])=>s.replace(r,v),t):t;
/* демо на случай, если data/live.json не загрузился */
const DEMO={updated:null,demo:true,people:[
 {n:'Паулетта',g:'f',t:['21'],old:false,q:['Да вы охренели все!','Опять держу лицо, блин'],b:[['мама','Мама, хватит меня успокаивать. Я злюсь.']]},
 {n:'Хуанито',g:'m',t:['43','33'],old:false,q:['Это не зуб, это мой батя','Ща как скажу им всё!'],b:[['папа','Папа, мне не нравится, как ты со мной говоришь.']]},
 {n:'Хуетта',g:'f',t:['46'],old:false,q:['Задолбали со своим «всё хорошо»!'],b:[]},
 {n:'Педрито',g:'m',t:['11','21'],old:false,q:['Нахрен медаль за покладистость!'],b:[['альфа-жертва','Я не буду молчать, когда мне неприятно!']]},
 {n:'Кончита',g:'f',t:['33'],old:false,q:['Я не злюсь. Я ЗЛЮСЬ!'],b:[]},
 {n:'Панчо',g:'m',t:['47'],old:false,q:['Чё вы ржёте, у меня 47-й горит!'],b:[]},
 {n:'Мерседес',g:'f',t:['36'],old:true,q:[],b:[]},{n:'Альфонсо',g:'m',t:['44'],old:true,q:[],b:[]}],
 fights:[[[0,'Ты опять за всех решила!'],[2,'А ты опять молчишь!'],[0,'Я не молчу, я держу лицо!'],[2,'Вот и держи, блин!']]],
 solo:[[1,['Я сегодня впервые сказал отцу, что мне неприятно.','Руки тряслись, но я это сделал!']]],
 bot:['Разбор: злость пришла, лицо держишь, зуб платит.','Напоминаю: листочек сам себя не напишет.']};

/* зубы */
const WD={1:92,2:80,3:88,4:90,5:90,6:106,7:104,8:98};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const H=88;
const shape=(p,w)=>{
  if(p<=2)return `M4 0V${H-10}Q4 ${H} 14 ${H}H${w-14}Q${w-4} ${H} ${w-4} ${H-10}V0Z`;
  if(p==3)return `M6 0V${H-28}L${w/2} ${H}L${w-6} ${H-28}V0Z`;
  if(p<=5)return `M6 0V${H-16}Q${w*.28} ${H} ${w/2} ${H-12}Q${w*.72} ${H} ${w-6} ${H-16}V0Z`;
  return `M3 0V${H-14}Q${w*.18} ${H} ${w*.34} ${H-12}Q${w*.5} ${H-22} ${w*.66} ${H-12}Q${w*.82} ${H} ${w-3} ${H-14}V0Z`};
let x=8;const xs=[];UP.forEach((f,i)=>{if(i==8)x+=18;xs.push(x);x+=WD[f%10]+6});
const TW=x+4,mid=xs[8]-12;
const T=$('#teeth');T.setAttribute('viewBox',`0 0 ${TW} 266`);
/* зуб в точке X; y0 — линия десны: у верхних коронка вниз, у нижних вверх */
const toothAt=(f,X,y0,low)=>{const w=WD[f%10],s=String(f),cy=low?y0-58:y0+58;
  return `<g class="tooth" data-f="${s}" role="button" tabindex="0" aria-label="Зуб ${s}, ${tname(s)}"><path transform="translate(${X},${y0})${low?' scale(1,-1)':''}" d="${shape(f%10,w)}"/><text class="num" x="${X+w/2}" y="${low?y0+26:y0-8}">${s}</text><g class="cnt" data-f="${s}" data-x="${X+w/2}" data-y="${cy}"></g></g>`};
T.innerHTML=`<line class="gum" x1="4" x2="${TW-4}" y1="30" y2="30"/><line class="gum" x1="4" x2="${TW-4}" y1="234" y2="234"/><line class="midl" x1="${mid}" x2="${mid}" y1="2" y2="264"/>`+UP.map((f,i)=>toothAt(f,xs[i],30,0)).join('')+LO.map((f,i)=>toothAt(f,xs[i],234,1)).join('');
/* телефон: вся формула помещается в ширину — 4 ряда по 8 (верх справа, верх слева, низ справа, низ слева) */
const TM=$('#teethM'),rowXs=r=>{let x=8;return r.map(f=>{const X=x;x+=WD[f%10]+6;return X})},MW=rowXs(UP.slice(0,8)).pop()+WD[1]+12;
const ROWS=[[UP.slice(0,8),30,0],[UP.slice(8),160,0],[LO.slice(0,8),390,1],[LO.slice(8),520,1]];
TM.setAttribute('viewBox',`0 0 ${MW} 556`);
TM.innerHTML=ROWS.map(([r,y0,low])=>{const X=rowXs(r);return `<line class="gum" x1="4" x2="${MW-4}" y1="${y0}" y2="${y0}"/>`+r.map((f,i)=>toothAt(f,X[i],y0,low)).join('')}).join('')+
  `<line class="midl" x1="4" x2="${MW-4}" y1="272" y2="272"/>`;

/* люди */
const A=$('#arena');let AW=A.clientWidth,AH=A.clientHeight;
const ro=new ResizeObserver(()=>{AW=A.clientWidth;AH=A.clientHeight});ro.observe(A);
const COL={f:'#e46aa2',m:'#4a86e8',u:'#8a7fd0',bot:'#9aa3b5',sad:'#7d8597'};
const MATRE=/ху[йеёяи]|пизд|бля|[её]б[ауил]|сук[аи]|жоп|нахер|хрен/i;
const mk=(d,kind)=>{const bot=kind===true,sad=kind=='sad';
  const old=!!d.old;
  const p={name:d.n,g:d.g,teeth:d.t||[],q:d.q||[],pb:d.b||[],c:bot?COL.bot:sad?COL.sad:COL[d.g]||COL.u,old,bot,
    x:.04+Math.random()*.92,y:old?Math.random()*.06:.25+Math.random()*.72,sp:.00005+Math.random()*.00005,walk:0,next:0,lock:old,hi:false};
  if(bot){p.x=1.12;p.y=.65;p.lock=true;p.sp=.00008}
  if(sad)p.lock=true;
  p.tx=p.x;p.ty=p.y;
  const el=document.createElement('div');el.className='p'+(old?' old':'')+(sad?' sad':'');el.style.setProperty('--c',p.c);
  if(old){el.setAttribute('aria-hidden','true');el.style.setProperty('--op',(.1+Math.random()*.3).toFixed(2))} // старые: просто рисунок на заднем плане
  else{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',p.name+(p.teeth.length?', зуб '+p.teeth.join(', '):''))}
  if(bot){el.className+=' botem';el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><text x="20" y="58" text-anchor="middle" style="font-size:46px">🤖</text></svg><span class="nm"></span>`}
  else el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><ellipse class="sh" cx="20" cy="79" rx="15" ry="3"/><circle class="hd" cx="20" cy="14" r="12"/><rect class="hs" x="8" y="2" width="24" height="24"/>${bot?'<text class="em" x="20" y="15">🤖</text>':''}<g class="face"></g><path class="bd" d="M20 26V77M9 50H31M7 77H33"/></svg><span class="nm"></span>`;
  el.querySelector('.nm').textContent=p.name;
  if(!old){el.addEventListener('click',()=>card(p));el.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();card(p)}})}
  p.el=el;p.b=el.querySelector('.b');A.append(el);return p};

let P=[],act=[],old=[],bot=null,DATA=DEMO,sel=null;
/* зона сценки (доли ширины и высоты): пока идёт сценка, туда никто не заходит */
let zone=null;
const candidate=p=>{
  let x=.04+Math.random()*.92,y=sel?(p.hi?.72+Math.random()*.26:.22+Math.random()*.3):.25+Math.random()*.72;
  if(zone){ // остаёмся со своей стороны зоны, чтобы не идти сквозь неё
    const roomL=zone.l-.04,roomR=.96-zone.r,leftSide=p.x<(zone.l+zone.r)/2;
    if(leftSide&&roomL>.06||!leftSide&&roomR<=.06&&roomL>.06)x=.04+Math.random()*roomL;
    else if(roomR>.06)x=zone.r+Math.random()*roomR;
    else y=zone.b+Math.random()*Math.max(.02,.98-zone.b); // по бокам места нет: встаём спереди
  }
  return {x,y}};
/* человечки выбирают место подальше от других, чтобы не толпиться */
const target=p=>{if(p.lock)return;let best=null,bd=-1;
  for(let k=0;k<7;k++){const c=candidate(p);let d=1e9;
    if(chase&&p!==chase.p&&!p.old)d=Math.hypot((chase.p.x-c.x)*AW,(chase.p.y-c.y)*AH); // убегаем от того, кто выебнулся
    else for(const o of P){if(o===p||o.old||o.bot||o.sad)continue;d=Math.min(d,Math.hypot((o.tx-c.x)*AW,(o.ty-c.y)*AH*.7),Math.hypot((o.x-c.x)*AW,(o.y-c.y)*AH*.7))}
    if(d>bd){bd=d;best=c}}
  p.tx=best.x;p.ty=best.y};
const place=p=>{const s=(.5+.55*p.y)*(p.old?.7:1)*(AW<520?.8:1);
  const fy=104+p.y*(AH-118),bob=p.moving&&!RM?Math.abs(Math.sin(p.walk/110))*3:0;
  p.el.style.transform=`translate(${(p.x*AW-20).toFixed(1)}px,${(fy-84-bob).toFixed(1)}px)`;
  p.el.style.setProperty('--s',s.toFixed(3));p.el.style.zIndex=p.el.classList.contains('talk')?300:Math.round(p.y*100);
  p.el.classList.toggle('r',p.x*AW>Math.max(AW*.5,AW-230))};
let last=performance.now();
const tick=t=>{const dt=Math.min(50,t-last);last=t;
  for(const p of P){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(RM){p.x=p.tx;p.y=p.ty;p.moving=false}
    else if(d>.004){const v=Math.min(p.sp*dt*(!p.lock&&zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b?3.5:1)*(chase&&!p.old?(p===chase.p?2.4:1.9):1),d);p.x+=dx/d*v;p.y+=dy/d*v*.6;p.walk+=dt;p.moving=true}
    else{p.moving=false;if(!p.lock){if(!p.next)p.next=t+800+Math.random()*3800;else if(t>p.next){p.next=0;target(p)}}}
    place(p)}
  requestAnimationFrame(tick)};

const say=(p,txt,ms,kind)=>{p.b.textContent=soft(txt);p.el.classList.add('talk');['fight','pb','pa','paa','react','brag'].forEach(k=>p.el.classList.toggle(k,kind==k));
  clearTimeout(p.st);p.st=setTimeout(()=>p.el.classList.remove('talk','fight','pb','pa','paa','react','brag'),ms)};
/* сколько держать бабл: никуда не торопимся.
   Одиночная фраза (монолог, точка Б, бот) висит ~10 секунд, реплика в диалоге ~5 секунд; длинные чуть дольше. */
const readMs=(t,mode)=>{const n=String(t).length;
  return mode=='dialog'?Math.min(7500,Math.max(5000,3000+n*40)):Math.min(13000,Math.max(10000,7000+n*50))};

/* Режиссёр. Случайной болтовни нет: на площадке идёт одна сценка за раз, потом тишина.
   Сценки: перепалка из чата, монолог, точка Б с грустнолицым, визит бота.
   Вокруг сценки пусто: остальные гуляют по краям и в зону не заходят. */
let scene=false;
const zoneHit=p=>zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b;
const clear=(cast,cx,cy)=>{
  const hw=Math.max(.2,125/Math.max(AW,1));
  zone={l:cx-hw,r:cx+hw,t:0,b:Math.min(.95,cy+.16)};
  const others=act.filter(p=>!cast.includes(p)&&!p.lock);
  others.forEach(p=>{p.next=0;target(p)}); // кто стоял в зоне, быстро уходит на свою сторону
  return others};
const release=ps=>{zone=null;ps.forEach(p=>{if(p.sad)return;p.lock=false;p.next=0})};
/* реплики, одна за другой, каждая столько, сколько её читать; возвращает общее время */
const play=(lines,start,mode)=>{let t=start;
  lines.forEach(([p,txt,kind])=>{const ms=readMs(txt,mode);setTimeout(()=>say(p,txt,ms,kind),t);t+=ms+(mode=='dialog'?400:900)});
  return t};
/* толпа изредка отзывается: не больше двух реплик за сценку, и только в паузе между репликами */
const cheerAt=(crowd,times)=>{const R=DATA.react||[];if(!R.length)return;
  times.forEach(t=>setTimeout(()=>{const w=crowd.filter(p=>!p.lock&&!p.el.classList.contains('talk')&&!zoneHit(p)&&(!sel||p.hi));if(w.length)say(rnd(w),rnd(R),3000,'react')},t))};
const spot=()=>({cx:.3+Math.random()*.4,cy:.42+Math.random()*.12});

const fightScene=done=>{const f=rnd(DATA.fights);
  const cnt={};f.forEach(([w])=>cnt[w]=(cnt[w]||0)+1);
  const cast=Object.keys(cnt).map(Number).sort((x,y)=>cnt[y]-cnt[x]).map(i=>P[i]);
  if(cast.some(p=>!p||p.old||p.lock)||(sel&&!cast.every(p=>p.hi)))return done(300);
  const {cx,cy}=spot(),gap=Math.max(.07,34/Math.max(AW,1));
  cast.forEach((p,i)=>{p.lock=true;p.tx=i==0?cx-gap:i==1?cx+gap:cx+(i%2?2.2:-2.2)*gap;p.ty=i<2?cy:cy+.08});
  const crowd=clear(cast,cx,cy);
  const end=play(f.map(([who,l])=>[P[who],l,'fight']),3200,'dialog');
  if(f.length>=4&&Math.random()<.6)cheerAt(crowd,[3200+(end-3200)*.55]); // отклик толпы ~3 с
  setTimeout(()=>{release(cast);done(3000)},end+700)};

/* монолог: человек выходит в центр и говорит несколько своих сообщений, написанных подряд;
   если таких нет — одну фразу, понятную без контекста */
const soloScene=done=>{
  const runs=(DATA.solo||[]).filter(([i])=>P[i]&&!P[i].old&&!P[i].lock&&(!sel||P[i].hi));
  let p,q;
  if(runs.length){const r=rnd(runs);p=P[r[0]];q=r[1]}
  else{const c=act.filter(x=>x.q.length&&!x.lock&&(!sel||x.hi));if(!c.length)return done(300);p=rnd(c);q=[rnd(p.q)]}
  const {cx,cy}=spot();
  p.lock=true;p.tx=cx;p.ty=cy;
  clear([p],cx,cy);
  const end=play(q.map(t=>[p,t]),3000);
  setTimeout(()=>{release([p]);done(3000)},end+500)};

/* Лица по рисунку владельца: код из таблицы «Лица» → черты на кружке головы (центр 20,14, радиус 12) */
const FACE={
  'улыбка':'<circle cx="16" cy="11" r="1.6"/><circle cx="24" cy="11" r="1.6"/><path d="M14 17Q20 23 26 17"/>',
  'грустный':'<path d="M13 8L18 6.5M27 8L22 6.5"/><circle cx="16" cy="11.5" r="1.6"/><circle cx="24" cy="11.5" r="1.6"/><path d="M14 21Q20 15.5 26 21"/>',
  'очень грустный':'<path d="M13 7.5L18 5.5M27 7.5L22 5.5"/><circle cx="16" cy="11.5" r="1.7"/><circle cx="24" cy="11.5" r="1.7"/><path class="tear" d="M15 14Q14 17 15.5 17.5Q17 17 16 14Z"/><path d="M13 22Q20 14 27 22"/>',
  'злой':'<path d="M12 7L18 10M28 7L22 10"/><circle cx="16" cy="12" r="1.6"/><circle cx="24" cy="12" r="1.6"/><path d="M14 21Q20 16.5 26 21"/>',
  'очень злой':'<path d="M11 6L18 10.5M29 6L22 10.5" style="stroke-width:2.8"/><circle cx="16" cy="12.5" r="1.8"/><circle cx="24" cy="12.5" r="1.8"/><path d="M14 20.5H26" style="stroke-width:2.4"/>',
  'ржущий злой':'<path d="M12 6.5L18 9.5M28 6.5L22 9.5"/><circle cx="16" cy="11.5" r="1.5"/><circle cx="24" cy="11.5" r="1.5"/><path class="open" d="M12.5 16Q20 26 27.5 16Z"/>',
  'портал':'<path d="M12 6L17 5M28 6L23 5"/><circle cx="15.5" cy="12" r="3.4" style="fill:#fff;stroke:#1d1d1d;stroke-width:1.4"/><circle cx="24.5" cy="12" r="3.4" style="fill:#fff;stroke:#1d1d1d;stroke-width:1.4"/><circle cx="15.5" cy="12.5" r="1.4"/><circle cx="24.5" cy="12.5" r="1.4"/><path d="M13 22.5Q20 16 27 22.5"/>'};
const GLASSES='<path class="glass" d="M10.5 9.5h8v4.6q0 1.6-1.6 1.6h-4.8q-1.6 0-1.6-1.6zM21.5 9.5h8v4.6q0 1.6-1.6 1.6h-4.8q-1.6 0-1.6-1.6z"/><path d="M18.5 11h3"/><path d="M14.5 18.5Q20 22.5 25.5 18.5"/>';
const setFace=(p,code,glasses)=>{const g=p.el.querySelector('.face');if(g)g.innerHTML=glasses?GLASSES:(FACE[code]||'')};
const flashTooth=f=>{if(!f)return;document.querySelectorAll(`.tooth[data-f="${f}"]`).forEach(g=>{g.classList.remove('flash');void g.getBBox();g.classList.add('flash')})};
const portalEl=()=>{let el=document.getElementById('portal');if(!el){el=document.createElement('div');el.id='portal';el.className='portal';
  el.innerHTML='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" style="fill:var(--bub);stroke:var(--fig);stroke-width:1.6"/><g class="face" transform="translate(0 6)">'+FACE['портал']+'</g></svg>';A.append(el)}return el};

/* Коммуникация из таблицы участников: адресат говорит фразу; участник отвечает из точки А (адресат добреет,
   участник грустнеет), иногда из АА, потом из точки Б (тёмные очки; лицо адресата меняется по таблице,
   зуб вспыхивает). Если «портал = да» — в центре вырастает портал уебищности, и все шарахаются к краям. */
const commScene=done=>{const list=(DATA.comm||[]).filter(c=>P[c[0]]&&!P[c[0]].old&&!P[c[0]].lock&&(!sel||P[c[0]].hi));if(!list.length)return done(300);
  const [i,role,f0,said,a,fa,aa,faa,b,fb,portal,tooth]=rnd(list),p=P[i];
  const {cx,cy}=spot(),left=Math.random()<.5,gap=Math.max(.08,40/Math.max(AW,1));
  const s=mk({n:role,g:'u',t:[]},'sad');s.sad=true;s.lock=true;s.el.classList.add('big');setFace(s,f0||'грустный');
  s.x=left?-.06:1.06;s.y=s.ty=cy;s.tx=cx+(left?-gap:gap);s.sp=.0002;P.push(s);
  p.lock=true;p.tx=cx+(left?gap:-gap);p.ty=cy;setFace(p,'улыбка');
  clear([p],cx,cy);
  let t=3400;const at=(ms,fn)=>setTimeout(fn,ms),step=(who,txt,kind,mode)=>{const ms=readMs(txt,mode);at(t,()=>say(who,txt,ms,kind));t+=ms+600;return t};
  step(s,said,'', 'dialog');
  if(a){const t0=t;step(p,a,'pa','dialog');at(t0+900,()=>{setFace(p,'грустный');setFace(s,fa||'улыбка')})}
  if(aa){const t0=t;step(p,aa,'paa','dialog');at(t0+900,()=>{setFace(p,'очень грустный');setFace(s,faa||fa||'улыбка')})}
  if(b){
    if(a||aa){at(t,()=>{setFace(p,'улыбка');setFace(s,f0||'грустный')});t+=700;step(s,said,'','dialog')}
    const t0=t;at(t0,()=>setFace(p,'',true));step(p,b,'pb','dialog');
    at(t0+900,()=>{setFace(s,fb||'очень грустный');flashTooth(tooth)});
    if(portal){const tp=t;at(tp,()=>{const el=portalEl();el.classList.add('on');
        zone={l:.15,r:.85,t:0,b:.95};act.filter(o=>o!==p&&!o.lock).forEach(o=>{o.next=0;target(o)})});
      at(tp+4200,()=>{portalEl().classList.remove('on');zone=null});t+=4600}
  }
  at(t+600,()=>{s.tx=left?-.14:1.14;setFace(p,'');release([p])});
  at(t+3600,()=>{s.el.remove();P.splice(P.indexOf(s),1);done(3000)})};

/* грустнолицый: «папа», «мама», «альфа-жертва»… студент говорит ему фразу точки Б; все молчат */
const pbScene=done=>{const c=act.filter(p=>p.pb.length&&!p.lock&&(!sel||p.hi));if(!c.length)return done(300);
  const p=rnd(c),[to,txt]=rnd(p.pb),angry=/!/.test(txt)||MATRE.test(txt);
  const {cx,cy}=spot(),left=Math.random()<.5,gap=Math.max(.07,34/Math.max(AW,1));
  const s=mk({n:to,g:'u',t:[]},'sad');s.sad=true;s.lock=true;setFace(s,angry?'злой':'грустный');
  s.x=left?-.06:1.06;s.y=s.ty=cy;s.tx=cx+(left?-gap:gap);s.sp=.0002;P.push(s);
  p.lock=true;p.tx=cx+(left?gap:-gap);p.ty=cy;
  clear([p],cx,cy);
  const end=play([[p,txt,'pb']],3600)+1200;
  setTimeout(()=>{s.tx=left?-.14:1.14;release([p])},end);
  setTimeout(()=>{s.el.remove();P.splice(P.indexOf(s),1);done(2500)},end+3000)};

/* «Выебон»: фразы из поста о констелляции новой мезодермы (канал психостоматологии).
   Кто так выебнулся — от того все разбегаются, а он гоняется за ними по площадке. */
const BRAG=['Я всё осознала','Я всё поняла','У меня всё пучком','Я принадлежу к классной тусовке','Я часто сравниваю себя с другими',
  'Хочу, чтоб меня признали самой классной и самой крутой','Иногда люблю унижать','Всегда ищу врагов','У меня должно быть всё самое лучшее. Просто так',
  'Хочу всё и всех держать под контролем и знать всё обо всех','Я не приемлю контроль над собой','Я настолько хороша, что могу не считаться с другими',
  'Важно быть правой и крутой в моменте, последствия меня не интересуют','Хочу быть самой главной, жить бесплатно и иметь всё',
  'Если что-то мне не принадлежит, я имею право отобрать','Использовать окружающих в своих интересах — моё кредо',
  'Меня никак не поменять. Кто хочет меня поменять — сразу в чёрный список'];
const MASC=[[/осознала/g,'осознал'],[/поняла/g,'понял'],[/самой классной и самой крутой/g,'самым классным и самым крутым'],[/хороша/g,'хорош'],
  [/правой и крутой/g,'правым и крутым'],[/самой главной/g,'самым главным']];
/* понты идут связкой: «осознала — поняла — всё пучком», иногда с добавкой из поста */
const BRAG_CORE=['Я всё осознала.','Я всё поняла.','У меня всё пучком.'];
const brag=p=>{const extra=BRAG.slice(3),t=BRAG_CORE.join(' ')+(Math.random()<.5?' '+rnd(extra)+'.':'');
  return p.g=='m'?MASC.reduce((s,[r,v])=>s.replace(r,v),t):t};
let chase=null;
const chaseScene=done=>{const c=act.filter(p=>!p.lock&&(!sel||p.hi));if(c.length<3)return done(300);
  const p=rnd(c),txt=brag(p);p.lock=true;chase={p};
  const others=()=>act.filter(o=>o!==p&&!o.lock);
  others().forEach(o=>{o.next=0;target(o)});                       // все разом разбегаются
  say(p,txt,readMs(txt),'brag');
  const hunt=setInterval(()=>{let best=null,bd=1e9;                // он бежит к ближайшему
    others().forEach(o=>{const d=Math.hypot((o.x-p.x)*AW,(o.y-p.y)*AH);if(d<bd){bd=d;best=o}});
    if(best){p.tx=best.x;p.ty=best.y}
    others().forEach(o=>{if(Math.hypot((o.x-p.x)*AW,(o.y-p.y)*AH)<140){o.next=0;target(o)}})},700);
  setTimeout(()=>{clearInterval(hunt);chase=null;p.lock=false;p.next=0;done(3500)},readMs(txt)+3000)};

const botScene=done=>{bot.y=bot.ty=.55+Math.random()*.35;bot.x=1.12;bot.tx=.8;
  const end=play([[bot,rnd(DATA.bot.length?DATA.bot:DEMO.bot)]],3200); // демо-фразы только в демо-режиме
  setTimeout(()=>{bot.tx=1.14},end+300);setTimeout(()=>done(2500),end+1200)};

const director=()=>{if(scene)return setTimeout(director,2000);
  // когда есть точки Б, им ~70% сценок; чату (перепалки, монологи, бот) ~30%
  // базовый блок: монологи и одиночные фразы; диалоги из чата убраны — диалоги будут «коммуникациями» с точками А и Б
  const chat=[];
  if((DATA.solo||[]).length||act.some(p=>p.q.length))chat.push(soloScene,soloScene,soloScene);
  chat.push(chaseScene);
  if(DATA.demo||DATA.bot.length)chat.push(botScene); // бот выходит, только если есть его фразы из разборов
  const special=[];
  if((DATA.comm||[]).length)special.push(commScene,commScene);
  if(act.some(p=>p.pb.length))special.push(pbScene);
  const opts=special.length&&Math.random()<.6?special:chat;
  scene=true;
  rnd(opts)(pause=>{scene=false;setTimeout(director,pause+Math.random()*2000)})};

/* выбор зуба */
const info=()=>{const I=$('#info');I.textContent='';
  if(!sel){I.innerHTML=`Нажмите на зуб, чтобы собрать тех, кто с ним работает.`;return}
  const a=act.filter(p=>p.hi);
  const b=document.createElement('b');b.textContent=`${sel} · ${cap(tname(sel))}`;I.append(b,document.createElement('br'),
    a.length?a.map(p=>p.name).join(', '):'Сейчас с этим зубом никто не работает')};
const pick=f=>{sel=sel===f?null:f;
  document.querySelectorAll('.tooth').forEach(g=>{g.classList.toggle('sel',g.dataset.f===sel);g.setAttribute('aria-pressed',g.dataset.f===sel)});
  P.forEach(p=>{p.hi=!!sel&&!p.old&&p.teeth.includes(sel);p.el.classList.toggle('hi',p.hi);p.el.classList.toggle('dim',!!sel&&!p.hi&&!p.bot);if(!p.lock){p.next=0;target(p)}});info()};
[T,TM].forEach(svg=>{svg.addEventListener('click',e=>{const g=e.target.closest('.tooth');if(g)pick(g.dataset.f)});
  svg.addEventListener('keydown',e=>{const g=e.target.closest('.tooth');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();pick(g.dataset.f)}})});
$('#all').addEventListener('click',()=>{if(sel)pick(sel)});

/* окошко человека */
const C=$('#card'),tl=f=>`${f} (${tname(f)})`;
const card=p=>{if(p.sad)return;C.hidden=false;const T2=p.teeth;
  const verb=p.old?(p.g=='f'?'работала':p.g=='m'?'работал':'работал(а)'):'работаю';
  const txt=p.bot?`Привет, я ${p.name}. Приношу цитаты из разборов.`:`Привет, меня зовут ${p.name}. `+(T2.length?`Я ${verb} ${T2.length>1?`с зубами ${T2.slice(0,-1).map(tl).join(', ')} и ${tl(T2[T2.length-1])}`:`с зубом ${tl(T2[0])}`}.`:'Мой зуб пока не записан.');
  C.innerHTML='<button class="x" type="button" aria-label="Закрыть">×</button><p style="padding-right:30px"></p>';
  C.querySelector('p').textContent=txt;C.querySelector('.x').addEventListener('click',()=>{C.hidden=true})};

const start=d=>{DATA=d;
  P=d.people.map(x=>mk(x,false));act=P.filter(p=>!p.old);old=P.filter(p=>p.old);
  bot=mk({n:'Бот Джузеппе',g:'u',t:[]},true);P.push(bot);
  document.querySelectorAll('.cnt').forEach(g=>{const n=act.filter(p=>p.teeth.includes(g.dataset.f)).length;if(!n)return;
    g.innerHTML=`<circle cx="${g.dataset.x}" cy="${g.dataset.y}" r="14"/><text x="${g.dataset.x}" y="${g.dataset.y}">${n}</text>`});
  const upd=d.updated?new Date(d.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}):null;
  $('#cnt').textContent=d.demo?'Демо: живые данные не загрузились':`Активных участников: ${act.length}`;
  info();requestAnimationFrame(tick);
  setTimeout(director,1200);
};
fetch('data/live.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>d.people&&d.people.length?d:DEMO).catch(()=>DEMO).then(start);

/* варианты */
const setV=v=>{document.body.dataset.v=v;$('#vdesc').textContent=`Вариант ${v}. ${VD[v]}`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))};
const fromHash=()=>{const m=location.hash.match(/^#v([1-5])$/);setV(m?m[1]:'1')};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){location.hash='v'+b.dataset.v}});
addEventListener('hashchange',fromHash);fromHash();
$('#old').addEventListener('change',e=>document.body.classList.toggle('noold',!e.target.checked));
}
</script>
</body>
</html>
