<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Психостоматология №1 LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Neucha&family=Manrope:wght@500;700&display=swap">
<style>
/* VOICE: игровой, живой, с матом из чата; первая страница по скетчу владельца
   IDEA: зубная формула над площадкой, где гуляют человечки-участники и говорят баблами
   PICTURE: 32 кликабельных зуба + площадка с фигурками «кружок, палка, две перекладины»
   COLOUR/TYPE: два варианта: блокнот и жёлтый блокнот
   LAYOUT: шапка с переключателем вариантов, строка зуба, сцена во всю ширину */
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;color-scheme:var(--cs)}
body[data-v="1"],body[data-v="2"]{--cs:light;--font:Neucha,"Comic Sans MS",cursive;--bg:#fbfaf5;--ink:#2a2a35;--mute:#5d5d6c;--stage:transparent;--arena:transparent;--tooth:#fff;--tink:#2a2a35;--tnum:#2a2a35;--fig:#2a2a35;--acc:#d2452f;--acct:#fff;--accs:#fde3dc;--bub:#fff;--bubi:#2a2a35;--bubl:#2a2a35;--tw:2.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#d3def0 31px 32px)}
/* 2: жёлтый блокнот — жёлтая линованная бумага, как у американских студентов: голубые линии, двойное красное поле */
body[data-v="2"]{--bg:#fbef8f;--tooth:#fffbe3;--bub:#fffbe3;--accs:#f9d7b8;
  background-image:linear-gradient(to right,transparent 0 calc(max(16px,4vw) - 14px),#e58a8a calc(max(16px,4vw) - 14px) calc(max(16px,4vw) - 12.5px),transparent calc(max(16px,4vw) - 12.5px) calc(max(16px,4vw) - 9px),#e58a8a calc(max(16px,4vw) - 9px) calc(max(16px,4vw) - 7.5px),transparent 0),repeating-linear-gradient(to bottom,transparent 0 31px,#9dbbd8 31px 32px)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 36px;padding-left:max(16px,4vw);padding-right:max(16px,4vw);display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--hfont,var(--font));font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.08;margin:0;text-wrap:balance}
.sub,.note{margin:0;color:var(--mute);font-size:.9em}
.tabs,.ctrl{display:flex;flex-wrap:wrap;gap:6px}
.ctrl{gap:8px 18px;align-items:center}
button{font:inherit}
.tabs button,.ctrl button{min-height:42px;padding:0 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--r,999px);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,.tooth:focus-visible,.p:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ctrl label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.ctrl input{width:20px;height:20px;accent-color:var(--acc)}
.info{margin:0;min-height:3em;font-size:1.05em}
.info b{font-size:1.25em}
.stage{background:var(--stage);border-radius:var(--sr,18px);overflow:hidden;border:var(--sb,0)}
.tw{overflow-x:auto}
.teeth{display:block;width:100%;min-width:640px;height:auto;padding:6px 8px 0}
.teethM{display:none;min-width:0}
/* телефон: по умолчанию вся формула двумя рядами, уменьшенная под экран; «⤢ крупнее» — четыре ряда по 8 */
.tw{position:relative}
.tzoom{display:none;position:absolute;right:6px;top:4px;z-index:5;min-height:36px;padding:0 10px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);font:700 13px Inter,system-ui,sans-serif;cursor:pointer}
@media(max-width:600px){.teeth{min-width:0;padding:42px 2px 0}.teeth .num{font-size:44px}.teeth .cnt circle{r:22px}.teeth .cnt text{font-size:26px}
  .tzoom{display:inline-flex;align-items:center}
  /* «крупнее»: та же формула в полный размер, листается пальцем влево-вправо */
  .tbig .teeth{min-width:980px;padding-top:42px}.tbig .teeth .num{font-size:21px}.tbig .teeth .cnt text{font-size:17px}.tbig .teeth .cnt circle{r:14px}
  .tzoom{position:sticky;left:calc(100% - 120px);float:right}
  .tbig::after{content:"← листайте →";position:sticky;left:8px;display:block;width:max-content;font:600 12px Inter,system-ui,sans-serif;color:var(--mute);padding:2px 8px}}
.tooth{cursor:pointer}
.tooth path{fill:var(--tooth);stroke:var(--tink);stroke-width:var(--tw);stroke-linejoin:round}
.tooth:hover path,.tooth:focus-visible path{fill:var(--accs)}
.tooth.sel path{fill:var(--acc)}
.num{fill:var(--tnum);font:700 21px Inter,system-ui,sans-serif;text-anchor:middle}

.cnt circle{fill:var(--acc)}.cnt text{fill:var(--acct);font:700 17px Manrope,sans-serif;text-anchor:middle;dominant-baseline:central}
.gum{stroke:var(--tink);stroke-width:var(--tw)}.midl{stroke:var(--tink);stroke-dasharray:6 8;stroke-width:2}
body[data-v="1"] .tooth path,body[data-v="1"] .p svg,body[data-v="2"] .tooth path,body[data-v="2"] .p svg{filter:url(#rough)}
.arena{position:relative;height:clamp(420px,66vh,680px);overflow:hidden;background:var(--arena)}
.p{position:absolute;left:0;top:0;width:40px;height:84px;cursor:pointer;transition:opacity .4s}
.p svg{width:40px;height:84px;overflow:visible;transform:scale(var(--s,1));transform-origin:50% 100%;display:block}
.hd{fill:var(--c)}.hs{display:none;fill:var(--c)}
.bd{fill:none;stroke:var(--fig);stroke-width:3;stroke-linecap:round}
.sh{fill:rgba(0,0,0,.16);display:none}
.em{font-size:15px;text-anchor:middle;dominant-baseline:central}
body[data-v="1"] .hd,body[data-v="2"] .hd{fill:var(--bg);stroke:var(--c);stroke-width:3}body[data-v="1"] .hd{fill:#ffd95a}body[data-v="2"] .hd{fill:#fff} /* смайлики: на белом блокноте лица жёлтые, на жёлтом — белые */body[data-v="1"] .bd,body[data-v="2"] .bd{stroke-width:2.5}
.nm{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;display:none;color:var(--nm,var(--ink));font-weight:700}

.p:hover .nm,.p.hi .nm,.p:focus-visible .nm{display:block}
.p.hi svg{filter:drop-shadow(0 0 5px var(--acc)) drop-shadow(0 0 2px var(--acc))}
.p.old{opacity:var(--op,.3);filter:grayscale(1);pointer-events:none}
.p.dim{opacity:.13}
.b{display:none;position:absolute;left:50%;bottom:calc(84px*var(--s,1) + 12px);transform:translateX(-24px);width:max-content;max-width:200px;padding:7px 11px;background:var(--bub);color:var(--bubi);border:2px solid var(--bubl);border-radius:16px;font-size:14px;line-height:1.25;z-index:2}
.b::after{content:"";position:absolute;left:14px;bottom:-8px;width:12px;height:12px;background:var(--bub);border-right:2px solid var(--bubl);border-bottom:2px solid var(--bubl);transform:rotate(45deg)}
.r .b{transform:translateX(calc(-100% + 24px))}.b{translate:var(--bx,0px) 0}.b::after{translate:calc(-1*var(--bx,0px)) 0} /* --bx: бабл сдвинут внутрь площадки, хвостик остаётся над головой */.r .b::after{left:auto;right:14px}
.talk .b{display:block}
.p.sad .nm:empty{display:none!important}
.p.sad .nm{display:block;top:auto;bottom:calc(84px*var(--s,1) + 2px);font-size:12px;background:var(--bub);color:var(--bubi);border:1px solid var(--bubl);border-radius:8px;padding:0 6px}
.p.sad.talk .nm{display:none}
.face circle{fill:#1d1d1d}.face path{fill:none;stroke:#1d1d1d;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.face .tear{fill:#4a86e8}.face .glass{fill:#111;stroke:none}.face .open{fill:#fff}
.p.big svg{transform:scale(calc(var(--s,1)*1.35))}.p.big .b{bottom:calc(84px*var(--s,1)*1.35 + 12px)}
.p.sad.big .nm{bottom:calc(84px*var(--s,1)*1.35 + 4px)}
.p.fighter svg{transform:scale(calc(var(--s,1)*1.3))}.p.big.fighter svg{transform:scale(calc(var(--s,1)*1.55))}
.p.sad.big.fighter .nm{bottom:calc(84px*var(--s,1)*1.55 + 4px)}
.p.fighter{transition:opacity .4s}.p.fighter .nm{display:block;font-size:13px;background:var(--bub);color:var(--bubi);border:1px solid var(--bubl);border-radius:8px;padding:0 6px}.p.speaking svg{filter:drop-shadow(0 0 6px var(--acc))}
.dlg{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:min(94%,560px);max-height:46%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;z-index:360;pointer-events:none;opacity:0;transition:opacity .4s}
.dlg.on{opacity:1}
.dl{max-width:80%;padding:7px 11px;border-radius:14px;background:var(--bub);color:var(--bubi);border:2px solid var(--bubl);font-size:15px;line-height:1.3;animation:dlin .35s ease-out;transition:opacity .4s}
.dl small{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.dl{align-self:center;width:100%;max-width:100%}
.dl.pa{background:#eceef3;color:#2a2d38;border-color:#8a90a3}.dl.paa{background:#e6e3f5;color:#2a2440;border-color:#7a6fb0}
.dl.pb{background:#ffe9a6;color:#2a1d00;border-color:#d9a400;font-weight:600}
@keyframes dlin{from{transform:translateY(14px);opacity:0}}
.cmp{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(96%,780px);display:flex;flex-wrap:wrap;gap:10px;z-index:370;pointer-events:none;opacity:0;transition:opacity .5s}
.cmp.on{opacity:1}
.cmp .box{flex:1 1 300px;background:var(--bg);border:2.5px solid var(--fig);border-radius:10px;padding:8px 10px 10px;display:grid;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.cmp .box.kb{border-color:#d9a400}
.cmp h4{margin:0;font-size:13px;font-weight:700;color:var(--mute)}
.cmp .pair{display:flex;justify-content:center;align-items:flex-end;gap:22px;min-height:96px}
.cmp figure{margin:0;display:grid;justify-items:center;gap:2px}.cmp figcaption{font-size:12px;font-weight:700}
.cmp .mf{width:34px;height:72px;overflow:visible}.cmp .mf.big{width:46px;height:96px}
.cmp .ln{display:flex;flex-direction:column;gap:5px}.cmp .dl{max-width:100%;font-size:14px}
.cmp .box.done{opacity:.75}
@media(max-width:600px){.cmp .box.done .pair,.cmp .box.done .ln{display:none}.cmp{top:4px}.cmp .box{flex-basis:100%;padding:6px 8px}.cmp .pair{min-height:72px}.cmp .mf{width:26px;height:56px}.cmp .mf.big{width:36px;height:76px}}
@media(prefers-reduced-motion:reduce){.dl{animation:none}}
.p.pa .b{background:#eceef3;color:#2a2d38;border-color:#8a90a3;border-width:3px;font-weight:700}
.p.pa .b::after{background:#eceef3;border-color:#8a90a3}
.p.pa .b::before{content:"точка А";display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.p.paa .b{background:#e6e3f5;color:#2a2440;border-color:#7a6fb0;border-width:3px;font-weight:700}
.p.paa .b::after{background:#e6e3f5;border-color:#7a6fb0}
.p.paa .b::before{content:"точка АА";display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.tooth.flash path{animation:flash .5s ease-in-out 4 alternate}
@keyframes flash{to{fill:#e8432f}}
.portal{position:absolute;left:50%;top:48%;width:min(56%,340px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:350;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,1.4,.4,1),opacity .6s}
.portal.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.portal svg{width:100%;height:100%;overflow:visible}
@media(prefers-reduced-motion:reduce){.portal{transition:opacity .3s}.tooth.flash path{animation:none;fill:#e8432f}}
.p.pa .b,.p.paa .b,.p.pb .b{max-width:240px}
/* история с триггером */
.p.fighter svg{transition:transform .8s}
/* бабл над увеличенным человечком: поднимаем на его рост, чтобы не закрывал лицо */
.p.fighter .b{bottom:calc(84px*var(--s,1)*1.3 + 12px);transition:bottom .8s}.p.big.fighter .b{bottom:calc(84px*var(--s,1)*1.55 + 12px)}.p.fighter.small .b{bottom:calc(84px*var(--s,1)*.85 + 12px)}@media(max-width:600px){.p.fighter .b{max-width:44vw!important}}.p.fighter.small svg{transform:scale(calc(var(--s,1)*.85))!important}
.scene-on .p:not(.cast):not(.old){opacity:.22;transition:opacity .8s}.p{transition:opacity .8s}
.scene-on .p.tuck:not(.cast){opacity:0!important} /* в диалоге: кто оказался в центре сценки или за баблом — не виден */
.p.kick .nm{display:none!important}
/* атака: необычный человечек (пунктирная голова), иногда прикрывается предметом */
.p.attacker .hd{stroke-dasharray:3 2.4}.p.attacker .prop{font-size:34px}
/* страница человека: он один и крупно, его зубы выделены, остальные приглушены */
body.focus .p:not(.hero):not(.sad){display:none}
.p.hero:not(.fighter) svg{transform:scale(calc(var(--s,1)*1.7))}.p.hero:not(.fighter) .nm{display:block;top:auto;bottom:-22px}
body.focus .tooth.off{opacity:.28;cursor:default}body.focus .tooth.mine path{fill:var(--accs)}body.focus .tooth.mine.sel path{fill:var(--acc)}body.focus .cnt{display:none}
body.focus .info{display:none}
.pl{padding:10px 14px 12px;border-top:2px dashed var(--fig);border-bottom:2px dashed var(--fig);display:grid;gap:6px;align-content:start}
@media(min-width:900px){body.focus .stage{display:grid;grid-template-columns:minmax(280px,360px) 1fr}body.focus .tw{grid-column:1/-1}body.focus .pl{border-bottom:0;border-right:2px dashed var(--fig)}}
.pl .plh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.pl .hello{margin:0;font-size:15px}
/* Карточка человека (вкладка «Карточки»): имя, зубы в работе, по каждому зубу пункты, сводка ИИ */
.pl .cardx{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:15px}.pl .cardx p{margin:0}.pl .cardx b{font-weight:700}
.pl .cardx ul{margin:0;padding-left:20px;display:grid;gap:6px}.pl .cardx ul ul{gap:1px;padding:2px 0 4px 34px;list-style:'– '}
.pl .cardx ul.teeth{list-style:none;padding-left:0;gap:2px}.pl .cardx summary{list-style:none;cursor:pointer;min-height:36px;display:flex;align-items:center;gap:4px}

.pl .back,.pl .more{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);font:700 14px Inter,system-ui,sans-serif;cursor:pointer;justify-self:start}
.pl .pltabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.pl .pltabs button{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);font:700 15px Inter,system-ui,sans-serif;cursor:pointer}.pl .pltabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.pl h3{margin:4px 0 0;font:700 18px Inter,system-ui,sans-serif}.pl .empty{margin:0;color:var(--mute)}

.boom{position:absolute;left:0;top:0;font:900 44px/1 Inter,system-ui,sans-serif;color:#e8432f;-webkit-text-stroke:2px #1d1d1d;z-index:380;pointer-events:none;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .35s cubic-bezier(.2,1.8,.4,1),opacity .3s}

/* демо на случай, если data/live.json не загрузился */
const DEMO={updated:null,demo:true,people:[
 {n:'Паулетта',g:'f',t:['21'],old:false,q:['Да вы охренели все!','Опять держу лицо, блин'],b:[['мама','Мама, хватит меня успокаивать. Я злюсь.']]},

 {n:'Хуетта',g:'f',t:['46'],old:false,q:['Задолбали со своим «всё хорошо»!'],b:[]},

 fights:[[[0,'Ты опять за всех решила!'],[2,'А ты опять молчишь!'],[0,'Я не молчу, я держу лицо!'],[2,'Вот и держи, блин!']]],

/* зубы */
const WD={1:92,2:80,3:88,4:90,5:90,6:106,7:104,8:98};
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const H=88;

  if(p<=2)return `M4 0V${H-10}Q4 ${H} 14 ${H}H${w-14}Q${w-4} ${H} ${w-4} ${H-10}V0Z`;
  if(p==3)return `M6 0V${H-28}L${w/2} ${H}L${w-6} ${H-28}V0Z`;
  if(p<=5)return `M6 0V${H-16}Q${w*.28} ${H} ${w/2} ${H-12}Q${w*.72} ${H} ${w-6} ${H-16}V0Z`;
  return `M3 0V${H-14}Q${w*.18} ${H} ${w*.34} ${H-12}Q${w*.5} ${H-22} ${w*.66} ${H-12}Q${w*.82} ${H} ${w-3} ${H-14}V0Z`};
let x=8;const xs=[];UP.forEach((f,i)=>{if(i==8)x+=18;xs.push(x);x+=WD[f%10]+6});

const toothAt=(f,X,y0,low)=>{const w=WD[f%10],s=String(f),cy=low?y0-58:y0+58;
  return `<g class="tooth" data-f="${s}" role="button" tabindex="0" aria-label="Зуб ${s}, ${tname(s)}"><path transform="translate(${X},${y0})${low?' scale(1,-1)':''}" d="${shape(f%10,w)}"/><text class="num" x="${X+w/2}" y="${low?y0+26:y0-8}">${s}</text><g class="cnt" data-f="${s}" data-x="${X+w/2}" data-y="${cy}"></g></g>`};
T.innerHTML=`<line class="gum" x1="4" x2="${TW-4}" y1="30" y2="30"/><line class="gum" x1="4" x2="${TW-4}" y1="234" y2="234"/><line class="midl" x1="${mid}" x2="${mid}" y1="2" y2="264"/>`+UP.map((f,i)=>toothAt(f,xs[i],30,0)).join('')+LO.map((f,i)=>toothAt(f,xs[i],234,1)).join('');
/* телефон: вся формула помещается в ширину — 4 ряда по 8 (верх справа, верх слева, низ справа, низ слева) */
const TM=$('#teethM'),rowXs=r=>{let x=8;return r.map(f=>{const X=x;x+=WD[f%10]+6;return X})},MW=rowXs(UP.slice(0,8)).pop()+WD[1]+12;
const ROWS=[[UP.slice(0,8),30,0],[UP.slice(8),160,0],[LO.slice(0,8),390,1],[LO.slice(8),520,1]];
TM.setAttribute('viewBox',`0 0 ${MW} 556`);
TM.innerHTML=ROWS.map(([r,y0,low])=>{const X=rowXs(r);return `<line class="gum" x1="4" x2="${MW-4}" y1="${y0}" y2="${y0}"/>`+r.map((f,i)=>toothAt(f,X[i],y0,low)).join('')}).join('')+
  `<line class="midl" x1="4" x2="${MW-4}" y1="272" y2="272"/>`;

/* люди */
const A=$('#arena');let AW=A.clientWidth,AH=A.clientHeight;
const ro=new ResizeObserver(()=>{AW=A.clientWidth;AH=A.clientHeight});ro.observe(A);
const COL={f:'#e46aa2',m:'#4a86e8',u:'#8a7fd0',bot:'#9aa3b5',sad:'#7d8597'};
const MATRE=/ху[йеёяи]|пизд|бля|[её]б[ауил]|сук[аи]|жоп|нахер|хрен/i;
const mk=(d,kind)=>{const bot=kind===true,sad=kind=='sad';
  const old=!!d.old;
  const p={name:d.n,g:d.g,teeth:d.t||[],q:d.q||[],pb:d.b||[],c:bot?COL.bot:sad?COL.sad:COL[d.g]||COL.u,old,bot,
    x:.04+Math.random()*.92,y:old?Math.random()*.06:.25+Math.random()*.72,sp:.00005+Math.random()*.00005,walk:0,next:0,lock:old,hi:false};
  if(bot){p.x=1.12;p.y=.65;p.lock=true;p.sp=.00008}
  if(sad)p.lock=true;
  p.tx=p.x;p.ty=p.y;
  const el=document.createElement('div');el.className='p'+(old?' old':'')+(sad?' sad':'');el.style.setProperty('--c',p.c);
  if(old){el.setAttribute('aria-hidden','true');el.style.setProperty('--op',(.1+Math.random()*.3).toFixed(2))} // старые: просто рисунок на заднем плане
  else{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',p.name+(p.teeth.length?', зуб '+p.teeth.join(', '):''))}
  if(bot){el.className+=' botem';el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><text x="20" y="58" text-anchor="middle" style="font-size:46px">🤖</text></svg><span class="nm"></span>`}
  else el.innerHTML=`<div class="b"></div><svg viewBox="0 0 40 84" aria-hidden="true"><ellipse class="sh" cx="20" cy="79" rx="15" ry="3"/><circle class="hd" cx="20" cy="14" r="12"/><rect class="hs" x="8" y="2" width="24" height="24"/>${bot?'<text class="em" x="20" y="15">🤖</text>':''}<g class="face"></g><path class="bd" d="M20 26V77M9 50H31M7 77H33"/></svg><span class="nm"></span>`;
  el.querySelector('.nm').textContent=p.name;
  if(!old){el.addEventListener('click',()=>tap(p));el.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();tap(p)}})}
  p.el=el;p.b=el.querySelector('.b');A.append(el);if(!bot)setFace(p,'база');return p};

let P=[],act=[],old=[],bot=null,DATA=DEMO,sel=null;
/* зона сценки (доли ширины и высоты): пока идёт сценка, туда никто не заходит */
let zone=null;
/* места, куда гуляющим нельзя: баблы диалога и участники разговора (прямоугольники в пикселях площадки) */
let AVOID=[];
const figBox=(x,y)=>{const sc=(.5+.55*y)*(AW<520?.8:1),fy=104+y*(AH-118);return {l:x*AW-22,r:x*AW+22,t:fy-84*sc-6,b:fy+4}};
const hits=(a,b)=>a.l<b.r&&b.l<a.r&&a.t<b.b&&b.t<a.b;
const inAvoid=(x,y)=>{if(!AVOID.length)return false;const f=figBox(x,y);return AVOID.some(r=>hits(f,r))};
/* триггер (большой грустнолицый) приходит за кем-то одним: толпа заранее спокойно расходится с его пути
   и в него не заходит. Путь — отрезок от того места, где он стоит, до того, куда он идёт */
const TRIG=()=>P.filter(o=>o.sad&&o.lock&&o.el.classList.contains('big'));
const segPx=(x,y,s)=>{const k=AW,m=Math.max(1,AH-118),ax=s.x*k,ay=s.y*m,bx=s.tx*k,by=s.ty*m,px=x*k,py=y*m,
  vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy,u=L?Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/L)):0;return Math.hypot(px-ax-u*vx,(py-ay-u*vy)*1.6)};
const nearTrig=(x,y,p)=>TRIG().some(s=>s.look!==p&&!s.el.classList.contains('attacker')&&segPx(x,y,s)<150);
/* атакующий (папа/мама из атак): все, кроме того, за кем он пришёл, от него разбегаются и обегают его стороной */
const ATKR=()=>P.filter(o=>o.el.classList.contains('attacker'));
const fearPx=(x,y,p)=>{let m=1e9;for(const s of ATKR())if(s.look!==p)m=Math.min(m,Math.hypot((s.x-x)*AW,(s.y-y)*AH),segPx(x,y,s));return m};
const candidate=p=>{
  let x=.04+Math.random()*.92,y=sel?(p.hi?.72+Math.random()*.26:.22+Math.random()*.3):.25+Math.random()*.72;
  if(zone){ // остаёмся со своей стороны зоны, чтобы не идти сквозь неё
    const roomL=zone.l-.04,roomR=.96-zone.r,leftSide=p.x<(zone.l+zone.r)/2;
    if(leftSide&&roomL>.06||!leftSide&&roomR<=.06&&roomL>.06)x=.04+Math.random()*roomL;
    else if(roomR>.06)x=zone.r+Math.random()*roomR;
    else if(zone.b>.95||zone.t>.3&&Math.random()<.5)y=.22+Math.random()*Math.max(.06,zone.t-.22); // по бокам места нет: сверху,
    else y=zone.b+Math.random()*Math.max(.02,.98-zone.b); // …или спереди
  }
  return {x,y}};
/* человечки выбирают место подальше от других, чтобы не толпиться */
const target=p=>{if(p.lock)return;let best=null,bd=-1;const tg=TRIG().length;
  for(let k=0;k<(AVOID.length||tg?20:7);k++){const c=candidate(p);if(inAvoid(c.x,c.y)||AVOID.length&&[.2,.4,.6,.8].some(f=>inAvoid(p.x+(c.x-p.x)*f,p.y+(c.y-p.y)*f)))continue;
    if(tg&&[0,.25,.5,.75,1].some(f=>nearTrig(p.x+(c.x-p.x)*f,p.y+(c.y-p.y)*f,p)))continue;let d=1e9; // и не через триггера: // ни точка, ни путь к ней — не за баблом
    const ak=ATKR().filter(s=>s.look!==p);
    if(ak.length)for(const f of [.25,.5,.75,1])d=Math.min(d,fearPx(p.x+(c.x-p.x)*f,p.y+(c.y-p.y)*f,p)); // от атакующего — подальше, и путь не мимо него
    else if(chase&&p!==chase.p&&!p.old)d=Math.hypot((chase.p.x-c.x)*AW,(chase.p.y-c.y)*AH); // убегаем от того, кто выебнулся
    else for(const o of P){if(o===p||o.old||o.bot||o.sad)continue;d=Math.min(d,Math.hypot((o.tx-c.x)*AW,(o.ty-c.y)*AH*.7),Math.hypot((o.x-c.x)*AW,(o.y-c.y)*AH*.7))}
    if(d>bd){bd=d;best=c}}
  if(!best){const s=tg&&TRIG()[0];best=s?{x:s.x<.5?.78+Math.random()*.18:.04+Math.random()*.18,y:s.y<.6?.82+Math.random()*.14:.25+Math.random()*.15}:candidate(p)}
  p.tx=best.x;p.ty=best.y};
const place=p=>{const s=(.5+.55*p.y)*(p.old?.7:1)*(AW<520?.8:1);
  const fy=104+p.y*(AH-118),bob=p.moving&&!RM?Math.abs(Math.sin(p.walk/110))*3:0;
  p.el.style.transform=`translate(${(p.x*AW-20).toFixed(1)}px,${(fy-84-bob).toFixed(1)}px)`;
  p.el.style.setProperty('--s',s.toFixed(3));p.el.style.zIndex=p.el.classList.contains('talk')?300:Math.round(p.y*100);
  p.el.classList.toggle('r',p.side?p.side=='l':p.x*AW>Math.max(AW*.5,AW-230))}; // side: бабл раскрывается от триггера
let last=performance.now();
let calm=false; // идёт диалог: фон гуляет медленно и спокойно, без рывков («сабай-сабай»)
let trigChk=0;
const tick=t=>{const dt=Math.min(50,t-last);last=t;
  if(t>trigChk){trigChk=t+250;const ak=ATKR().length;if(TRIG().length){for(const p of P)if(!p.lock&&!p.sad&&!p.bot){
      p.flee=ak&&fearPx(p.x,p.y,p)<300; // атакующий рядом — бегом
      if(nearTrig(p.tx,p.ty,p)||ak&&fearPx(p.tx,p.ty,p)<220){p.next=0;target(p)}}}else for(const p of P)p.flee=false} // стоит на пути триггера — отходит
  for(const p of P){
    if(p.orb&&t>=p.orb.t0){const o=p.orb,th=o.ph+(t-o.t0)*o.w; // плавное кружение по эллипсу, считается в каждом кадре
      p.x=p.tx=o.cx+o.R*Math.cos(th);p.y=p.ty=o.cy+o.r*Math.sin(th);p.moving=false;place(p);continue}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(RM){p.x=p.tx;p.y=p.ty;p.moving=false}
    else if(d>.004){const out=!p.lock&&(zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b||inAvoid(p.x,p.y)),v=Math.min(p.sp*dt*(calm&&!p.lock?(out?.42:.3)*Math.min(1,.35+d/.05):out?3.5:1)*(chase&&!p.old?(p===chase.p?2.4:1.9):1)*(p.flee&&!p.lock?4:1),d);p.x+=dx/d*v;p.y+=dy/d*v*.6;p.walk+=calm&&!p.lock?dt*.5:dt;p.moving=true}
    else{p.moving=false;if(!p.lock){if(!p.next)p.next=t+(calm?4000+Math.random()*6000:800+Math.random()*3800);else if(t>p.next){p.next=0;target(p)}}}
    if(calm||p.tk){const tk=calm&&!p.lock&&!p.el.classList.contains('cast')&&(zone&&p.x>zone.l&&p.x<zone.r&&p.y>zone.t&&p.y<zone.b||inAvoid(p.x,p.y));
      if(tk!==!!p.tk){p.tk=tk;p.el.classList.toggle('tuck',tk)}}
    place(p)}
  requestAnimationFrame(tick)};

const say=(p,txt,ms,kind)=>{p.b.textContent=soft(txt);p.el.classList.add('talk');['fight','pb','pa','paa','react','brag','emo'].forEach(k=>p.el.classList.toggle(k,kind==k));
  // бабл не вылезает за край площадки (узкий экран, человечек у края): сдвигаем его внутрь
  p.b.style.removeProperty('--bx');requestAnimationFrame(()=>{const r=p.b.getBoundingClientRect(),a=A.getBoundingClientRect();if(!r.width)return;
    let dx=r.left<a.left+6?a.left+6-r.left:r.right>a.right-6?a.right-6-r.right:0;dx=Math.max(-(r.width-34),Math.min(r.width-34,dx));
    if(dx)p.b.style.setProperty('--bx',dx.toFixed(1)+'px')});
  clearTimeout(p.st);p.st=setTimeout(()=>p.el.classList.remove('talk','fight','pb','pa','paa','react','brag','emo'),ms)};
/* сколько держать бабл: никуда не торопимся.
   Одиночная фраза (монолог, точка Б, бот) висит ~10 секунд, реплика в диалоге ~5 секунд; длинные чуть дольше. */
const readMs=(t,mode)=>{const n=String(t).length;
  return mode=='dialog'?Math.min(7500,Math.max(5000,3000+n*40)):Math.min(13000,Math.max(10000,7000+n*50))};

/* Режиссёр. Случайной болтовни нет: на площадке идёт одна сценка за раз, потом тишина.
   Сценки: перепалка из чата, монолог, точка Б с грустнолицым, визит бота.
   Вокруг сценки пусто: остальные гуляют по краям и в зону не заходят. */
let scene=false;
const zoneHit=p=>zone&&p.x>zone.l&&p.x<zone.r&&p.y<zone.b;
const clear=(cast,cx,cy)=>{
  const hw=Math.max(.2,125/Math.max(AW,1));
  zone={l:cx-hw,r:cx+hw,t:0,b:Math.min(.95,cy+.16)};
  const others=act.filter(p=>!cast.includes(p)&&!p.lock);
  others.forEach(p=>{p.next=0;target(p)}); // кто стоял в зоне, быстро уходит на свою сторону
  return others};
const release=ps=>{zone=null;ps.forEach(p=>{if(p.sad)return;p.lock=false;p.next=0})};
/* реплики, одна за другой, каждая столько, сколько её читать; возвращает общее время */
const play=(lines,start,mode)=>{let t=start;
  lines.forEach(([p,txt,kind])=>{const ms=readMs(txt,mode);setTimeout(()=>say(p,txt,ms,kind),t);t+=ms+(mode=='dialog'?400:900)});
  return t};
/* толпа изредка отзывается: не больше двух реплик за сценку, и только в паузе между репликами */
const cheerAt=(crowd,times)=>{const R=DATA.react||[];if(!R.length)return;
  times.forEach(t=>setTimeout(()=>{const w=crowd.filter(p=>!p.lock&&!p.el.classList.contains('talk')&&!zoneHit(p)&&(!sel||p.hi));if(w.length)say(rnd(w),rnd(R),3000,'react')},t))};
const spot=()=>({cx:.3+Math.random()*.4,cy:.42+Math.random()*.12});

const fightScene=done=>{const f=rnd(DATA.fights);
  const cnt={};f.forEach(([w])=>cnt[w]=(cnt[w]||0)+1);
  const cast=Object.keys(cnt).map(Number).sort((x,y)=>cnt[y]-cnt[x]).map(i=>P[i]);
  if(cast.some(p=>!p||p.old||p.lock)||(sel&&!cast.every(p=>p.hi)))return done(300);
  const {cx,cy}=spot(),gap=Math.max(.07,34/Math.max(AW,1));
  cast.forEach((p,i)=>{p.lock=true;p.tx=i==0?cx-gap:i==1?cx+gap:cx+(i%2?2.2:-2.2)*gap;p.ty=i<2?cy:cy+.08});
  const crowd=clear(cast,cx,cy);
  const end=play(f.map(([who,l])=>[P[who],l,'fight']),3200,'dialog');
  if(f.length>=4&&Math.random()<.6)cheerAt(crowd,[3200+(end-3200)*.55]); // отклик толпы ~3 с
  setTimeout(()=>{release(cast);done(3000)},end+700)};

/* монолог: человек выходит в центр и говорит несколько своих сообщений, написанных подряд;

const soloScene=done=>{
  const runs=(DATA.solo||[]).filter(([i])=>P[i]&&!P[i].old&&!P[i].lock&&(!sel||P[i].hi));

  const {cx,cy}=spot();
  p.lock=true;p.tx=cx;p.ty=cy;
  clear([p],cx,cy);
  const end=play(q.map(t=>[p,t]),3000);
  setTimeout(()=>{release([p]);done(3000)},end+500)};

/* Коммуникация из таблицы участников — схватка на татами. Адресат говорит фразу; участник отвечает
   из точки А (адресат добреет, участник грустнеет), иногда из АА, потом из точки Б (тёмные очки; лицо
   адресата меняется по таблице, зуб вспыхивает). Пока идёт схватка, оба крупнее и кружат по центру,
   как бойцы на ринге, а реплики стопкой поднимаются над татами. «портал = да» — портал уебищности. */
/* «История с триггером» — раскадровка владельца (Серега и батя), шаблон почти для каждого участника.
   Включается, когда у коммуникации есть «продолжение_Б»: оно идёт строго по очереди триггер / участник / …
   1) все бегают и улыбаются; 2) участник в центре, входит триггер (фраза_адресата может быть действием:
   «приходит домой»); 3) точка А: участник маленький, аккуратно ходит вокруг — триггер улыбается, потом
   растерян; 4) точка Б: участник в восторге носится вокруг (игрушки — если они есть в истории), зуб вспыхивает;
   5) триггер всё злее; 6) «КИ-Я!» — триггер в шоке; 7) «ПОБЕДА!» — круги вокруг триггера. */
const isAct=t=>/^[а-яё]/.test(String(t).trim()); // со строчной буквы — действие: не подписываем, его играют человечки
/* «действие: Реплика» — человечек делает действие, а то, что после двоеточия с заглавной, идёт баблом:
   «кидается на папу, обнимает, рыдает: Папа, я люблю тебя» → [действие, реплика] */
const actSplit=t=>{t=String(t).trim();const m=isAct(t)&&t.match(/^([^:]+?):\s*([А-ЯЁA-Z«"].*)$/);return m?[m[1],m[2]]:isAct(t)?[t,'']:['',t]};
const isCrowd=t=>/^толпа\s*:/i.test(String(t).trim()); // «толпа: вау, она огонь; вся в деда пошла» — кричат человечки вокруг
const feetPx=p=>[p.x*AW,104+p.y*(AH-118)];
/* беготня на своей половине: участник и его бабл никогда не заходят на триггера.
   Полоса начинается за плечом триггера, бабл раскрывается наружу, от триггера */
const runSide=(p,s,side,slow)=>{const gap=Math.max(.1,95/Math.max(AW,1)),far=side=='l'?Math.max(.04,s.x-gap-.34):Math.min(.96,s.x+gap+.34);
  const bw=Math.min(250,AW*.46)/Math.max(AW,1); // место под бабл снаружи, чтобы не уезжал за край
  const lo=side=='l'?Math.min(s.x-gap-.01,Math.max(far,bw)):s.x+gap,hi=side=='l'?s.x-gap:Math.max(s.x+gap+.01,Math.min(far,1-bw));
  p.tx=lo+Math.random()*Math.max(.01,hi-lo);p.ty=s.y-.1+Math.random()*.24;
  return slow?2600+Math.random()*1200:550+Math.random()*350};
const TOYS=['🧸','🚗','⚽','🪀','🧱','🦖','🎈','🪁','🎲'];
/* игрушки летят по всей «квартире», а не только к ногам */
const throwToy=(p,k)=>{const el=document.createElement('div');el.className='toy';el.textContent=TOYS[k%TOYS.length];

const storyScene=(C,done)=>{const [i,role,f0,said,a,fa,aa,faa,b,fb,portal,tooth]=C,p=P[i],chain=C[14]||[],intro=C[15]||[];
  const side=Math.random()<.5?'l':'r',narrow=AW<600,cx=side=='l'?(narrow?.84:.64):(narrow?.16:.36),cy=.58;
  const sp0=p.sp,toys=[],proofs=[],timers=[];
  // «показывает рукой»: рука-палочка участника вытягивается и чуть поднимается в сторону триггера (без эмоджи)
  const point=on=>{const g=p.el.querySelector('svg');let a=g.querySelector('.pt');if(!on){if(a)a.remove();return}
    still();if(!a){a=document.createElementNS('http://www.w3.org/2000/svg','path');a.setAttribute('class','bd pt');g.append(a)}g.style.overflow='visible';
    a.setAttribute('d',side=='l'?'M31 50L56 42':'M9 50L-16 42')};let run=null,blink=null,pace=null;
  let t=0;const at=(ms,fn)=>timers.push(setTimeout(fn,ms)),wait=ms=>{t+=ms},
    line=(who,txt,kind)=>{const ms=readMs(txt,'dialog')+1500;at(t,()=>say(who,txt,ms,kind));t+=ms+400},
    // бегать по своей половине: медленно и аккуратно (А) или носиться (Б)
    roam=slow=>{clearTimeout(run);p.sp=slow?.00006:.0005;const go=()=>{run=setTimeout(go,runSide(p,s,side,slow))};go()},
    still=()=>{clearTimeout(run);run=null};
  // 1. все бегают и улыбаются

      +(side=='r'?`L${x+w},${by-hw}${T}L${x+w},${by+hw}`:'')+`L${x+w},${y+h-R}Q${x+w},${y+h} ${x+w-R},${y+h}`

      +(side=='l'?`L${x},${by+hw}${T}L${x},${by-hw}`:'')+`L${x},${y+R}Q${x},${y} ${x+R},${y}Z`;
    if(!b._w){b._w=document.createElementNS('http://www.w3.org/2000/svg','path');WD.append(b._w)}
    b._w.setAttribute('d',path);b._w.classList.toggle('on',b.classList.contains('on'))};
  // контур с хвостом каждый кадр повторяет за текстом: облачко плывёт — хвост тянется следом, голова идёт — хвост за ней
  let alive=true;const rw=()=>{if(!alive)return;els.forEach(b=>{if((b._box||b._fly)&&b._sp)wedge(b,b.offsetLeft,b.offsetTop,b.offsetWidth,b.offsetHeight)});requestAnimationFrame(rw)};rw();
  const arrived=o=>Math.hypot(o.tx-o.x,o.ty-o.y)<.006;
  const waitFor=(cond,fn,max=6000)=>{const t0=performance.now(),tick=()=>cond()||performance.now()-t0>max?fn():timers.push(setTimeout(tick,200));tick()};
  const enter=o=>{if(!inScene.has(o)){inScene.add(o);o.lock=true;o.sp=.00024;o.el.classList.add('cast','named')}[o.tx,o.ty]=home.get(o)};
  const headPx=o=>{const [x,y]=home.get(o);return [x*AW,104+y*(AH-118)-84*(.5+.55*y)*(AW<520?.8:1)]};
  // Раскладка по рисунку владельца: у каждого говорящего свой столбик облачков над головой.
  // Новое сообщение — внизу, хвостиком к голове; прежние плавно поднимаются, как шарики,
  // и висят на ниточке за облачко под ними. Что уходит за верх (или четвёртое в столбике) — тает.
  const shown=()=>els.filter(b=>b._box);
  const bodyOf=o=>{const [x,y]=home.get(o),f=figBox(x,y);return {l:f.l-26,r:f.r+26,t:f.t-8,b:f.b+24}};
  const headOf=o=>{const [x,y]=home.get(o),f=figBox(x,y),sc=(.5+.55*y)*(AW<520?.8:1);return [(f.l+f.r)/2,f.t+6+12*sc]};
  const updAvoid=()=>{const bx=shown().map(b=>({l:b._box.x-10,r:b._box.x+b._box.w+10,t:b._box.y-10,b:b._box.y+b._box.h+10}));
    AVOID=bx.concat(cast.filter(o=>inScene.has(o)).map(o=>{const r=bodyOf(o);return {l:r.l-20,r:r.r+20,t:r.t-10,b:r.b+10}}));
    act.forEach(o=>{if(!o.lock&&inAvoid(o.tx,o.ty)){o.next=0;target(o)}})}; // кто шёл за облачко — разворачивается
  const cols=new Map(),GAP=24,TAIL=30;
  // ширина облачка — чтобы соседние столбики не наезжали друг на друга
  const colW=o=>{const hx=headOf(o)[0],dx=Math.min(1e9,...cast.filter(c=>c!==o).map(c=>Math.abs(headOf(c)[0]-hx)));return Math.max(96,Math.min(220,dx-12,AW*.6))};
  const layCol=(o,nb)=>{const list=cols.get(o)||[];const [hx,hy]=headOf(o);let y=hy-14-TAIL;
    for(let k=list.length-1;k>=0;k--){const b=list[k],w=b.offsetWidth,h=b.offsetHeight;y-=h;
      if(y<4){list.splice(0,k+1).forEach(drop);break}
      const x=Math.max(4,Math.min(AW-w-4,hx-w/2));b._box={x,y,w,h};b._str=k<list.length-1?list[k+1]:null;b.style.left=x+'px';
      if(b===nb){b.style.setProperty('transition','none','important');b.style.top=(y+18)+'px';void b.offsetTop;b.style.removeProperty('transition');
        const yy=y;requestAnimationFrame(()=>{b.style.top=yy+'px'})} // новое всплывает снизу на своё место
      else b.style.top=y+'px';
      y-=GAP}
    updAvoid()};
  const putBubble=(b,o)=>{if(!cols.has(o))cols.set(o,[]);const list=cols.get(o);
    while(list.length>=3)drop(list.shift());list.push(b);layCol(o,b);wedge(b,b._box.x,b._box.y+18,b._box.w,b._box.h)};
  // уходит облачком: поднимается и тает
  const drop=b=>{b._box=null;b._str=null;b._fly=true;b.style.top=(b.offsetTop-60)+'px';b.classList.remove('on');if(b._w)b._w.classList.remove('on');
    cols.forEach(l=>{const i=l.indexOf(b);if(i>=0)l.splice(i,1)});setTimeout(()=>{b._fly=false;b.remove();if(b._w)b._w.remove()},1000);updAvoid()};
  // концовка «ванна»: говорившие уходят за край, потом коллаж — каждая в своей ванне, шушукаются
  const outro=()=>{at(1800,()=>{els.forEach(b=>{if(b._box)drop(b)});cast.forEach((o,k)=>{o.sp=.0004;o.tx=1.14;o.ty=.55+k*.08})});
    at(4200,()=>{const C=document.createElement('div');C.className='tubs';C.style.setProperty('--k',Math.min(1,(AW-16)/436).toFixed(3));els.push(C);
      const dark=new Set(T0.dark||[]),fr=cast.slice(0,2).map(o=>{const f=document.createElement('div');f.className='tubf'+(dark.has(o.name)?' dark':'');
        const g=document.createElement('div');g.className='fig';g.style.setProperty('--c',getComputedStyle(o.el).getPropertyValue('--c'));
        const sv=o.el.querySelector('svg').cloneNode(true);sv.removeAttribute('style');g.append(sv);
        f.innerHTML='<svg class="tub" viewBox="0 0 200 150" aria-hidden="true"><path class="tp" d="M168 80V44q0-10-10-10h-12"/><path class="tl" d="M54 126l-7 14M146 126l7 14"/><path class="tb2" d="M22 80H178Q178 126 130 126H70Q22 126 22 80Z"/><g class="fm"><circle cx="40" cy="80" r="9"/><circle cx="56" cy="76" r="8"/><circle cx="104" cy="77" r="9"/><circle cx="122" cy="80" r="8"/><circle cx="140" cy="76" r="9"/><circle cx="158" cy="80" r="7"/></g></svg><span class="shu"></span><span class="nm2"></span>';
        f.prepend(g);f.querySelector('.nm2').textContent=o.name;C.append(f);return f});
      A.append(C);requestAnimationFrame(()=>C.classList.add('on'));
      const W=['шу-шу','пс-пс','хи-хи','шу-шу-шу','пс…'];
      for(let k=0;k<7;k++)at(700+k*1000,()=>{fr.forEach((f,j)=>f.querySelector('.shu').classList.toggle('on',j==k%fr.length));const s=fr[k%fr.length].querySelector('.shu');s.textContent=W[k%W.length]});
      at(8000,()=>{C.classList.remove('on');setTimeout(()=>C.remove(),600)});
      at(8700,()=>{fin();done(3500)})})};
  const step=i=>{if(i>=L.length)return T0.end=='ванна'?outro():at(2200,()=>{fin();done(3500)});
    const l=L[i],q=l.to!=null?L[l.to]:null,to=q&&q.p!==l.p?q.p:null;
    enter(l.p);if(to)enter(to);
    l.R.forEach(r=>{if(cast.includes(r.p))enter(r.p)}); // реагирующий из диалога — встаёт на своё место
    const ms=readMs(l.say,'dialog')+(l.R.length?1400:0);
    waitFor(()=>arrived(l.p),()=>{
      const b=document.createElement('div');b.className='tb';
      b.innerHTML='<span class="tx"></span>';b.querySelector('.tx').textContent=soft(l.say);
      b._sp=l.p;b.style.maxWidth=colW(l.p)+'px';A.append(b);els.push(b);
      putBubble(b,l.p);requestAnimationFrame(()=>{b.classList.add('on');if(b._w)b._w.classList.add('on')});
      l.p.el.classList.add('speaking');setTimeout(()=>l.p.el.classList.remove('speaking'),1600);
      l.R.forEach((r,j)=>at(1100+j*800,()=>{const h=Math.max(2500,ms-1100-j*800);
        // эмодзи — с той стороны головы, где нет баблов (справа, слева или сверху)
        const ar=A.getBoundingClientRect(),hr=r.p.el.querySelector('svg').getBoundingClientRect(),hx=hr.left-ar.left+hr.width/2,hy=hr.top-ar.top+hr.height*.2;
        const busy=z=>shown().some(x=>hits(z,{l:x._box.x,r:x._box.x+x._box.w,t:x._box.y,b:x._box.y+x._box.h}));
        const R_={l:hx+8,r:hx+90,t:hy-28,b:hy+28},L_={l:hx-90,r:hx-8,t:hy-28,b:hy+28};
        r.p.el.classList.remove('eml','emt');if(busy(R_))r.p.el.classList.add(busy(L_)?'emt':'eml');
        // реагирующий со стороны замирает на месте, пока висит эмодзи — не ходит по баблам и людям
        const fz=!inScene.has(r.p)&&!r.p.lock;if(fz){r.p.lock=true;r.p.tx=r.p.x;r.p.ty=r.p.y}
        r.p.el.classList.add('cast','rxon');say(r.p,r.e,h,'emo');
        setTimeout(()=>{r.p.el.classList.remove('rxon');if(!inScene.has(r.p)){r.p.el.classList.remove('cast');if(fz){r.p.lock=false;r.p.next=0}}},h)}));
      at(ms,()=>step(i+1))},6000)};
  at(600,()=>step(0));
  const fin=()=>{alive=false;calm=false;AVOID=[];els.forEach(b=>{b._box=null;b.classList.remove('on');setTimeout(()=>b.remove(),400)});WD.style.opacity=0;setTimeout(()=>WD.remove(),400);
    A.classList.remove('scene-on');act.forEach(o=>o.el.classList.remove('rxon'));L.forEach(l=>l.R.forEach(r=>{if(!inScene.has(r.p))r.p.el.classList.remove('cast')}));
    cast.forEach(o=>{o.el.classList.remove('cast','named','speaking');o.sp=sp0.get(o)});release(cast);curScene=null};
  curScene={p:cast[0],stop:()=>{timers.forEach(clearTimeout);fin();zone=null;scene=false}}};
/* Атака (data/attacks.json): {who, tooth, role, face, prop, say}. Приходит необычный человечек с лицом face,
   ищет в толпе участника who (подходит к паре других, приглядывается), находит и говорит ему фразу say.
   {имя} во фразе — ник участника. Пока звучит фраза, у участника на карте пульсирует зуб tooth. */
let ATK=[];
fetch('data/attacks.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(t=>{ATK=Array.isArray(t)?t.filter(a=>a&&a.who&&a.say):[]}).catch(()=>{});
const atkText=a=>String(a.say).replace(/\{имя\}/g,a.who);
const attackScene=(A0,done)=>{const p=byNick(A0.who);if(!p||p.lock&&!focus)return done(300);
  const timers=[],at=(ms,fn)=>timers.push(setTimeout(fn,ms)),sp0=p.sp;let blink=null,ended=false;
  const fromL=p.x>.5; // приходит с дальней от участника стороны, через толпу
  const s=mk({n:A0.role||'',g:'u',t:[]},'sad');s.sad=true;s.lock=true;s.el.classList.add('big','fighter','attacker');setFace(s,A0.face||'злой');
  if(A0.prop){const sv=s.el.querySelector('svg'),tx=document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('class','prop');tx.setAttribute('x','20');tx.setAttribute('y','62');tx.setAttribute('text-anchor','middle');tx.textContent=A0.prop;sv.append(tx)} // прикрывается: предмет перед телом
  s.x=fromL?-.06:1.06;s.y=s.ty=.55;s.tx=s.x;s.sp=.00016;P.push(s);
  const near=o=>Math.hypot((o.x-s.x)*AW,(o.y-s.y)*AH)<60;
  // идёт прямо к участнику; остальные от него разбегаются (ATKR в target/tick), ни с кем не пересекается
  const look=[];s.look=p;
  const go=(k)=>{if(ended)return;
    if(k<look.length){const o=look[k];s.look=o;s.tx=o.x+(o.x>s.x?-.06:.06);s.ty=o.y;
      const chk=()=>{if(ended)return;if(near(o)||Math.hypot(s.tx-s.x,s.ty-s.y)<.01){setFace(s,A0.face||'злой');at(1400,()=>go(k+1))}else{s.tx=o.x+(o.x>s.x?-.06:.06);s.ty=o.y;at(200,chk)}};at(200,chk);return}
    // 2. нашёл: идёт к участнику, тот замирает
    s.look=p;
    const chk=()=>{if(ended)return;const side=s.x<p.x?'l':'r',gap=Math.max(.09,85/Math.max(AW,1));
      s.tx=Math.max(.06,Math.min(.94,p.x+(side=='l'?-gap:gap)));s.ty=p.y;
      if(Math.hypot((s.x-p.x)*AW,(s.y-p.y)*AH)<260&&!p.lock){p.lock=true;p.tx=p.x;p.ty=p.y}

  const meet=side=>{if(ended)return;s.side=side;p.side=side=='l'?'r':'l'; // баблы раскрываются наружу

    clear([p,s],(p.x+s.x)/2,p.y);
    const txt=atkText(A0),ms=readMs(txt,'dialog')+2500;
    // с первого слова атаки и до конца сценки участник грустный, потом снова обычный смайлик
    at(900,()=>{setFace(p,'грустный');say(s,txt,ms,'');if(A0.tooth){flashTooth(A0.tooth);blink=setInterval(()=>flashTooth(A0.tooth),2100)}});
    at(900+ms+300,()=>{clearInterval(blink);s.sp=.00016;s.tx=side=='l'?-.14:1.14});
    at(900+ms+3800,wrap);at(900+ms+4800,()=>{fin();done(3000)})};
  const wrap=()=>{clearInterval(blink);A.classList.remove('scene-on');p.el.classList.remove('cast','fighter','talk');p.side=null;p.sp=sp0;setFace(p,'');s.el.classList.remove('cast');release([p])};
  const fin=()=>{ended=true;curScene=null;s.el.remove();if(P.includes(s))P.splice(P.indexOf(s),1)};
  go(0);
  curScene={p,stop:()=>{timers.forEach(clearTimeout);wrap();fin();zone=null;scene=false}}};
const director=()=>{if(scene||focus)return kick(2000); // на странице человека сцены идут только из его плейлиста
  const list=(DATA.comm||[]).filter(c=>isStory(c)&&P[c[0]]&&!P[c[0]].old&&!P[c[0]].lock&&(!sel||P[c[0]].hi));
  const talk=TALK.filter(t=>{const L=talkLines(t);return L.length&&L.every(l=>l.p&&!l.p.lock)&&(!sel||L.some(l=>l.p.hi))});
  const atk=ATK.filter(a=>{const p=byNick(a.who);return p&&!p.lock&&(!sel||p.hi)});
  if(!list.length&&!talk.length&&!atk.length)return kick(4000);
  scene=true;const fin=pause=>{scene=false;kick(pause+4000+Math.random()*4000)};
  // истории главные; атаки и реплики — в паузах между ними
  const r=Math.random();
  if(atk.length&&(r<.3||!list.length&&!talk.length))attackScene(rnd(atk),fin);
  else if(list.length&&(!talk.length||r<.65))storyScene(rnd(list),fin);else if(talk.length)talkScene(rnd(talk),fin);else attackScene(rnd(atk),fin)};

/* выбор зуба */
const info=()=>{const I=$('#info');I.textContent='';
  if(!sel){I.innerHTML=`Нажмите на зуб, чтобы собрать тех, кто с ним работает.`;return}
  const a=act.filter(p=>p.hi);
  const b=document.createElement('b');b.textContent=`${sel} · ${cap(tname(sel))}`;I.append(b,document.createElement('br'),
    a.length?a.map(p=>p.name).join(', '):'Сейчас с этим зубом никто не работает')};
const pick=f=>{sel=sel===f?null:f;
  document.querySelectorAll('.tooth').forEach(g=>{g.classList.toggle('sel',g.dataset.f===sel);g.setAttribute('aria-pressed',g.dataset.f===sel)});
  P.forEach(p=>{p.hi=!!sel&&!p.old&&p.teeth.includes(sel);p.el.classList.toggle('hi',p.hi);p.el.classList.toggle('dim',!!sel&&!p.hi&&!p.bot);if(!p.lock){p.next=0;target(p)}});info()};
$('#tzoom').addEventListener('click',e=>{const on=$('#tw').classList.toggle('tbig');e.currentTarget.textContent=on?'⤡ мельче':'⤢ крупнее';if(on)$('#tw').scrollLeft=($('#tw').scrollWidth-$('#tw').clientWidth)/2;e.currentTarget.setAttribute('aria-pressed',on)});
/* на странице человека зуб выбирает сцены из его жизни; иначе собирает всех, кто с ним работает */
const toothTap=f=>{if(!focus)return pick(f);if(!teethOf(focus).includes(f))return;fT=fT===f?null:f;plOpen=false;markTeeth();plRender()};
[T,TM].forEach(svg=>{svg.addEventListener('click',e=>{const g=e.target.closest('.tooth');if(g)toothTap(g.dataset.f)});
  svg.addEventListener('keydown',e=>{const g=e.target.closest('.tooth');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();toothTap(g.dataset.f)}})});
$('#all').addEventListener('click',()=>{exitFocus();if(sel)pick(sel)});

/* окошко человека */
const C=$('#card'),tl=f=>`${f} (${tname(f)})`;
const greet=p=>{const T2=p.teeth,verb=p.old?(p.g=='f'?'работала':p.g=='m'?'работал':'работал(а)'):'работаю';
  return p.bot?`Привет, я ${p.name}. Приношу цитаты из разборов.`:`Привет, меня зовут ${p.name}. `+(T2.length?`Я ${verb} ${T2.length>1?`с зубами ${T2.slice(0,-1).map(tl).join(', ')} и ${tl(T2[T2.length-1])}`:`с зубом ${tl(T2[0])}`}.`:'Мой зуб пока не записан.')};
const card=p=>{if(p.sad)return;C.hidden=false;const txt=greet(p);
  C.innerHTML='<button class="x" type="button" aria-label="Закрыть">×</button><p style="padding-right:30px"></p>';
  C.querySelector('p').textContent=txt;C.querySelector('.x').addEventListener('click',()=>{C.hidden=true})};

const start=d=>{DATA=d;
  P=d.people.map(x=>mk(x,false));act=P.filter(p=>!p.old);old=P.filter(p=>p.old);
  bot=mk({n:'Бот Джузеппе',g:'u',t:[]},true);P.push(bot);
  document.querySelectorAll('.cnt').forEach(g=>{const n=act.filter(p=>p.teeth.includes(g.dataset.f)).length;if(!n)return;
    g.innerHTML=`<circle cx="${g.dataset.x}" cy="${g.dataset.y}" r="14"/><text x="${g.dataset.x}" y="${g.dataset.y}">${n}</text>`});
  const upd=d.updated?new Date(d.updated).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}):null;
  $('#cnt').textContent=d.demo?'Демо: живые данные не загрузились':`Активных участников: ${act.length}`;
  info();requestAnimationFrame(tick);
  kick(1200);
};
fetch('data/live.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(d=>d.people&&d.people.length?d:DEMO).catch(()=>DEMO).then(start);

/* варианты */
const setV=v=>{document.body.dataset.v=v;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v))};
const fromHash=()=>{const m=location.hash.match(/^#v([12])$/);setV(m?m[1]:'1')};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){location.hash='v'+b.dataset.v}});
addEventListener('hashchange',fromHash);fromHash();
}
