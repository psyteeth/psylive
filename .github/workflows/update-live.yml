name: Обновить живую страницу

on:
  schedule:
    - cron: "7 * * * *" # каждый час
  workflow_dispatch: {}
  push: # после правки кода выгрузки сразу проверить её на живых данных
    branches: [main]
    paths: ["scripts/**", "apps_script/**", ".github/workflows/update-live.yml"]

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Забрать данные из Apps Script и проверить
        env:
          LIVE_URL: ${{ secrets.LIVE_URL }}
        run: python3 scripts/fetch_live.py

      - name: Закоммитить, если что-то изменилось
        run: |
          if git diff --quiet -- data/live.json && git ls-files --error-unmatch data/live.json >/dev/null 2>&1; then
            echo "Ничего не изменилось"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "Обновить живую страницу ($(date -u +'%F %H:%M'))"
          git push
